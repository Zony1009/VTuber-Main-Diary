<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Oshi Center - 我的主推應援站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75',
                            950: '#4a044e',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .gradient-border {
            background: linear-gradient(135deg, #d946ef, #8b5cf6, #3b82f6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090d16] text-slate-100 antialiased selection:bg-pink-500 selection:text-white">

    <!-- Top Layer Navigation: Oshi Switcher Header -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo / App Title -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-pink-500/30">
                        <i data-lucide="heart" class="w-6 h-6 fill-current"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent">OshiCenter</span>
                        <span class="text-xs text-slate-400 block hidden sm:block">VTuber 應援與收藏管理</span>
                    </div>
                </div>

                <!-- First Layer: VTuber Switcher Tabs -->
                <div class="flex items-center space-x-2 overflow-x-auto py-2 no-scrollbar max-w-[50vw] sm:max-w-md lg:max-w-lg" id="oshiTabsContainer">
                    <!-- Dynamic Oshi Tabs will be inserted here -->
                </div>

                <!-- Action Buttons: Add New Oshi -->
                <div class="flex items-center space-x-2">
                    <button onclick="openOshiModal()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white text-xs sm:text-sm font-medium transition shadow-md shadow-pink-500/20 active:scale-95">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">新增主推</span>
                        <span class="sm:hidden">新增</span>
                    </button>
                    <button onclick="openOshiModal(currentOshiId)" id="editOshiBtn" title="編輯當前主推" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Second Layer: Function Sub-Tabs -->
        <nav class="bg-slate-950/80 border-t border-slate-800/80">
            <div class="max-w-7xl mx-auto px-4 flex justify-center sm:justify-start space-x-1 sm:space-x-4">
                <button onclick="switchTab('home')" id="tabBtn-home" class="subtab-btn flex items-center space-x-2 px-4 py-2.5 text-sm font-medium border-b-2 border-pink-500 text-pink-400 transition">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>🏠 主頁</span>
                </button>
                <button onclick="switchTab('calendar')" id="tabBtn-calendar" class="subtab-btn flex items-center space-x-2 px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>📅 行事曆</span>
                </button>
                <button onclick="switchTab('merch')" id="tabBtn-merch" class="subtab-btn flex items-center space-x-2 px-4 py-2.5 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>🛍️ 周邊紀錄</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ==================== TAB 1: HOME ==================== -->
        <section id="view-home" class="space-y-6">
            <!-- Banner & Profile Header Section -->
            <div class="relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl">
                <!-- Cover Image / Banner -->
                <div class="h-48 sm:h-64 sm:min-h-[260px] w-full bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 relative overflow-hidden">
                    <img id="homeCoverImg" src="" alt="Cover Banner" class="w-full h-full object-cover hidden">
                    <div id="homeCoverPlaceholder" class="w-full h-full flex items-center justify-center text-slate-600 bg-slate-800/50">
                        <i data-lucide="image" class="w-12 h-12 stroke-[1.5]"></i>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/20"></div>
                </div>

                <!-- Profile Info Overlay Container -->
                <div class="relative px-6 pb-6 pt-0 sm:pt-4">
                    <div class="flex flex-col sm:flex-row items-center sm:items-end space-y-4 sm:space-y-0 sm:space-x-6 -mt-20 sm:-mt-24 mb-4">
                        <!-- Avatar -->
                        <div class="relative w-32 h-32 sm:w-36 sm:h-36 rounded-2xl p-1 gradient-border shadow-xl shrink-0 bg-slate-900">
                            <div class="w-full h-full rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center">
                                <img id="homeAvatarImg" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                                <div id="homeAvatarPlaceholder" class="text-slate-500">
                                    <i data-lucide="user" class="w-16 h-16"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Name & Dates -->
                        <div class="flex-1 text-center sm:text-left space-y-2">
                            <h1 id="homeName" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide"></h1>
                            <div class="flex flex-wrap justify-center sm:justify-start gap-2 text-xs sm:text-sm">
                                <span id="homeBirthdayBadge" class="hidden items-center px-3 py-1 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-300">
                                    <i data-lucide="cake" class="w-3.5 h-3.5 mr-1.5"></i>
                                    <span id="homeBirthdayText"></span>
                                </span>
                                <span id="homeDebutBadge" class="hidden items-center px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300">
                                    <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-1.5"></i>
                                    <span id="homeDebutText"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Tags Bar -->
                    <div id="homeTagsContainer" class="flex flex-wrap gap-2 mb-4 justify-center sm:justify-start"></div>

                    <!-- Bio Section -->
                    <div id="homeBioCard" class="hidden mt-4 p-4 rounded-xl bg-slate-800/50 border border-slate-700/50 text-slate-300 text-sm leading-relaxed">
                        <p id="homeBioText" class="whitespace-pre-line"></p>
                    </div>
                </div>
            </div>

            <!-- Social Links & Live Stream Section Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Social Links -->
                <div class="lg:col-span-1 bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-white mb-4 flex items-center space-x-2">
                            <i data-lucide="share-2" class="w-5 h-5 text-pink-400"></i>
                            <span>社群連結</span>
                        </h2>
                        <div id="socialLinksContainer" class="space-y-3">
                            <!-- Social Buttons Rendered Dynamically -->
                        </div>
                    </div>
                </div>

                <!-- Live Stream Preview Zone -->
                <div class="lg:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                                <i data-lucide="tv" class="w-5 h-5 text-red-400"></i>
                                <span>直播預告 / 待機所</span>
                            </h2>
                            <span id="streamStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">未設定</span>
                        </div>

                        <div id="streamEmbedCard" class="rounded-xl overflow-hidden bg-slate-950 border border-slate-800 aspect-video flex flex-col items-center justify-center p-6 text-center">
                            <i data-lucide="video-off" class="w-12 h-12 text-slate-600 mb-3"></i>
                            <p class="text-slate-400 text-sm" id="streamMessage">目前暫無設定直播資訊，點擊右上角設定按鈕編輯</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: CALENDAR ==================== -->
        <section id="view-calendar" class="hidden space-y-6">
            <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-6 shadow-xl">
                <!-- Calendar Header & Navigation -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                    <div class="flex items-center space-x-3">
                        <div class="p-2.5 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20">
                            <i data-lucide="calendar-days" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h2 id="calendarMonthYear" class="text-xl font-bold text-white">2026 年 10 月</h2>
                            <p class="text-xs text-slate-400">活動記錄、紀念日與重大事項</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="flex items-center space-x-1 bg-slate-800 rounded-lg p-1 border border-slate-700">
                            <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-slate-700 rounded-md text-slate-300 transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                            <button onclick="resetToToday()" class="px-3 py-1 hover:bg-slate-700 rounded-md text-xs font-medium text-slate-300 transition">今天</button>
                            <button onclick="changeMonth(1)" class="p-1.5 hover:bg-slate-700 rounded-md text-slate-300 transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                        <button onclick="openEventModal()" class="flex items-center space-x-1.5 px-3 py-2 rounded-lg bg-pink-600 hover:bg-pink-700 text-white text-sm font-medium transition shadow-md">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>新增事件</span>
                        </button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-2">
                    <div class="text-red-400">日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div class="text-indigo-400">六</div>
                </div>
                
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 min-h-[360px]">
                    <!-- Dynamic Calendar Days rendered via JS -->
                </div>
            </div>

            <!-- Event Details / List Card -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg">
                <h3 class="text-md font-bold text-slate-200 mb-3 flex items-center space-x-2">
                    <i data-lucide="list-todo" class="w-4 h-4 text-pink-400"></i>
                    <span>本月事件明細</span>
                </h3>
                <div id="monthlyEventsList" class="space-y-2">
                    <!-- Dynamic Event Items -->
                </div>
            </div>
        </section>

        <!-- ==================== TAB 3: MERCH TRACKER ==================== -->
        <section id="view-merch" class="hidden space-y-6">
            <!-- Total Expense Banner Card -->
            <div class="bg-gradient-to-r from-purple-900/40 via-slate-900 to-pink-900/30 rounded-2xl border border-purple-500/30 p-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-4">
                    <div class="p-3.5 rounded-2xl bg-pink-500/20 text-pink-400 border border-pink-500/30">
                        <i data-lucide="wallet" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">全站累積總消費金額</div>
                        <div id="totalSpendAmount" class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-300">NT$ 0</div>
                    </div>
                </div>
                <button onclick="openMerchModal()" class="w-full sm:w-auto flex items-center justify-center space-x-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium shadow-lg transition active:scale-95">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    <span>紀錄新周邊</span>
                </button>
            </div>

            <!-- Merch Items Grouped by Event -->
            <div id="merchGroupContainer" class="space-y-6">
                <!-- Grouped Merch Tables rendered dynamically -->
            </div>
        </section>

    </main>

    <!-- ==================== MODALS ==================== -->

    <!-- 1. OSHI SETUP MODAL (Onboarding / Edit) -->
    <div id="oshiModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl relative my-8">
            <button onclick="closeOshiModal()" id="closeOshiModalBtn" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 id="oshiModalTitle" class="text-xl font-bold text-white mb-2 flex items-center space-x-2">
                <i data-lucide="user-plus" class="w-5 h-5 text-pink-400"></i>
                <span>新增主推 VTuber</span>
            </h2>
            <p class="text-xs text-slate-400 mb-6">填寫基本資料與設定。預設欄位皆留白，可依需求填寫。</p>

            <form id="oshiForm" onsubmit="saveOshiData(event)" class="space-y-4">
                <input type="hidden" id="oshiIdInput">

                <!-- Avatar Upload & Cover Upload -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">形象大頭貼 (圖片檔)</label>
                        <input type="file" id="oshiAvatarFile" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-pink-400 hover:file:bg-slate-700 cursor-pointer bg-slate-950 rounded-xl border border-slate-800 p-1">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">背景封面圖 (圖片檔)</label>
                        <input type="file" id="oshiCoverFile" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-pink-400 hover:file:bg-slate-700 cursor-pointer bg-slate-950 rounded-xl border border-slate-800 p-1">
                    </div>
                </div>

                <!-- Name & Dates -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">名稱 *</label>
                        <input type="text" id="oshiNameInput" required placeholder="如：浠 Mizuki" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">生日 (MM-DD)</label>
                        <input type="text" id="oshiBirthdayInput" placeholder="如：12-25" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">出道日期 (YYYY-MM-DD)</label>
                        <input type="date" id="oshiDebutInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                    </div>
                </div>

                <!-- Tags & Bio -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">標籤 (以半角逗點分割)</label>
                    <input type="text" id="oshiTagsInput" placeholder="如：歌姬, 極狐, 子午計畫" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">個人簡介</label>
                    <textarea id="oshiBioInput" rows="2" placeholder="填寫主推的特色或簡介..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500"></textarea>
                </div>

                <!-- Social URLs -->
                <div class="border-t border-slate-800 pt-3">
                    <span class="text-xs font-bold text-slate-400 block mb-2">社群連結網址 (選填)</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <input type="url" id="socialYouTube" placeholder="YouTube 頻道網址" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                        <input type="url" id="socialTwitter" placeholder="X (Twitter) 網址" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                        <input type="url" id="socialTwitch" placeholder="Twitch 網址" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                        <input type="url" id="socialInstagram" placeholder="Instagram 網址" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                    </div>
                </div>

                <!-- Stream Video URL -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">直播預告 YouTube 網址 / Embed ID (選填)</label>
                    <input type="text" id="oshiStreamInput" placeholder="https://www.youtube.com/watch?v=... 或 影片ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <!-- Footer Buttons -->
                <div class="flex items-center justify-between border-t border-slate-800 pt-4 mt-6">
                    <button type="button" onclick="deleteOshi()" id="deleteOshiBtn" class="hidden text-xs text-red-400 hover:text-red-300 px-3 py-2 rounded-lg bg-red-500/10 hover:bg-red-500/20 transition">
                        刪除此主推
                    </button>
                    <div class="flex space-x-2 ml-auto">
                        <button type="submit" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium text-sm transition shadow-md">
                            儲存變更
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. CALENDAR EVENT MODAL -->
    <div id="eventModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeEventModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 id="eventModalTitle" class="text-lg font-bold text-white mb-4">新增行事曆事件</h2>

            <form id="eventForm" onsubmit="saveEventData(event)" class="space-y-4">
                <input type="hidden" id="eventIdInput">
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">日期 *</label>
                    <input type="date" id="eventDateInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">事件標題 *</label>
                    <input type="text" id="eventTitleInput" required placeholder="如：會員扣款日 / 週年直播" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">事件類型</label>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        // Storage Key Constants
        const STORAGE_KEY = 'VTUBER_OSHI_CENTER_DATA_V1';

        // Global State Structure
        let appData = {
            currentOshiId: null,
            oshis: [] // Array of { id, name, birthday, debut, tags, bio, social, streamUrl, avatarBase64, coverBase64, events: [], merches: [] }
        };

        // Calendar Logic State
        let calendarDate = new Date();

        // --- Core Startup & Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            lucide.createIcons();

            // Onboarding Check: If no Oshi exists, open forced Onboarding Modal
            if (!appData.oshis || appData.oshis.length === 0) {
                openOshiModal(null, true);
            } else {
                if (!appData.currentOshiId && appData.oshis.length > 0) {
                    appData.currentOshiId = appData.oshis[0].id;
                }
                renderAll();
            }
        });

        // Save State to LocalStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch (e) {
                console.error('LocalStorage quota exceeded or failed:', e);
                alert('無法儲存資料，可能是上傳之圖片容量過大，請更換較小的圖片檔案。');
            }
        }

        // Load State from LocalStorage
        function loadFromLocalStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    appData = JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse local storage data', e);
                }
            }
        }

        // Helper: Helper to convert File object to Compressed Base64 String
        function fileToBase64(file, maxWidth = 800) {
            return new Promise((resolve, reject) => {
                if (!file) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Compress quality to 0.75 JPEG
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                        resolve(compressedBase64);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // Helper: Get Current Oshi Object
        function getCurrentOshi() {
            return appData.oshis.find(o => o.id === appData.currentOshiId) || null;
        }

        // --- Render Engine ---
        function renderAll() {
            renderOshiTabs();
            renderHomeView();
            renderCalendarView();
            renderMerchView();
            lucide.createIcons();
        }

        // --- Render Oshi Header Tabs ---
        function renderOshiTabs() {
            const container = document.getElementById('oshiTabsContainer');
            container.innerHTML = '';

            appData.oshis.forEach(oshi => {
                const isActive = oshi.id === appData.currentOshiId;
                const btn = document.createElement('button');
                btn.onclick = () => switchOshi(oshi.id);
                btn.className = `flex items-center space-x-2 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap border ${
                    isActive 
                    ? 'bg-pink-500/20 text-pink-300 border-pink-500/50 shadow-md' 
                    : 'bg-slate-800/60 text-slate-400 hover:text-slate-200 border-slate-700/50 hover:bg-slate-800'
                }`;

                let avatarHtml = `<div class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[10px] text-slate-300 font-bold">${oshi.name.charAt(0)}</div>`;
                if (oshi.avatarBase64) {
                    avatarHtml = `<img src="${oshi.avatarBase64}" class="w-5 h-5 rounded-full object-cover">`;
                }

                btn.innerHTML = `${avatarHtml}<span>${oshi.name}</span>`;
                container.appendChild(btn);
            });
        }

        // --- Switch Active Oshi ---
        function switchOshi(id) {
            appData.currentOshiId = id;
            saveToLocalStorage();
            renderAll();
        }

        // --- SubTab View Switcher ---
        function switchTab(tabName) {
            document.querySelectorAll('section[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.subtab-btn').forEach(btn => {
                btn.classList.remove('border-pink-500', 'text-pink-400');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
                activeBtn.classList.add('border-pink-500', 'text-pink-400');
            }
        }

        // ==================== HOME VIEW RENDERER ====================
        function renderHomeView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            // Name
            document.getElementById('homeName').textContent = oshi.name || '未命名主推';

            // Cover Banner
            const coverImg = document.getElementById('homeCoverImg');
            const coverPlaceholder = document.getElementById('homeCoverPlaceholder');
            if (oshi.coverBase64) {
                coverImg.src = oshi.coverBase64;
                coverImg.classList.remove('hidden');
                coverPlaceholder.classList.add('hidden');
            } else {
                coverImg.classList.add('hidden');
                coverPlaceholder.classList.remove('hidden');
            }

            // Avatar
            const avatarImg = document.getElementById('homeAvatarImg');
            const avatarPlaceholder = document.getElementById('homeAvatarPlaceholder');
            if (oshi.avatarBase64) {
                avatarImg.src = oshi.avatarBase64;
                avatarImg.classList.remove('hidden');
                avatarPlaceholder.classList.add('hidden');
            } else {
                avatarImg.classList.add('hidden');
                avatarPlaceholder.classList.remove('hidden');
            }

            // Birthday
            const bdayBadge = document.getElementById('homeBirthdayBadge');
            if (oshi.birthday) {
                document.getElementById('homeBirthdayText').textContent = `生日：${oshi.birthday}`;
                bdayBadge.classList.remove('hidden');
                bdayBadge.classList.add('flex');
            } else {
                bdayBadge.classList.add('hidden');
            }

            // Debut Date
            const debutBadge = document.getElementById('homeDebutBadge');
            if (oshi.debut) {
                document.getElementById('homeDebutText').textContent = `出道日：${oshi.debut}`;
                debutBadge.classList.remove('hidden');
                debutBadge.classList.add('flex');
            } else {
                debutBadge.classList.add('hidden');
            }

            // Tags
            const tagsContainer = document.getElementById('homeTagsContainer');
            tagsContainer.innerHTML = '';
            if (oshi.tags) {
                const tagList = oshi.tags.split(',').map(t => t.trim()).filter(Boolean);
                tagList.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs text-slate-300 font-medium';
                    tagEl.textContent = `# ${tag}`;
                    tagsContainer.appendChild(tagEl);
                });
            }

            // Bio
            const bioCard = document.getElementById('homeBioCard');
            if (oshi.bio) {
                document.getElementById('homeBioText').textContent = oshi.bio;
                bioCard.classList.remove('hidden');
            } else {
                bioCard.classList.add('hidden');
            }

            // Social Buttons
            const socialContainer = document.getElementById('socialLinksContainer');
            socialContainer.innerHTML = '';
            
            const socialConfigs = [
                { key: 'youtube', label: 'YouTube 頻道', icon: 'youtube', color: 'hover:bg-red-500/20 hover:border-red-500/50 hover:text-red-300' },
                { key: 'twitter', label: 'X (Twitter)', icon: 'twitter', color: 'hover:bg-sky-500/20 hover:border-sky-500/50 hover:text-sky-300' },
                { key: 'twitch', label: 'Twitch 實況', icon: 'tv', color: 'hover:bg-purple-500/20 hover:border-purple-500/50 hover:text-purple-300' },
                { key: 'instagram', label: 'Instagram', icon: 'instagram', color: 'hover:bg-pink-500/20 hover:border-pink-500/50 hover:text-pink-300' }
            ];

            let hasSocial = false;
            socialConfigs.forEach(conf => {
                const url = oshi.social ? oshi.social[conf.key] : null;
                if (url) {
                    hasSocial = true;
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = `flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-slate-200 transition ${conf.color}`;
                    a.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <i data-lucide="${conf.icon}" class="w-5 h-5"></i>
                            <span class="font-medium">${conf.label}</span>
                        </div>
                        <i data-lucide="external-link" class="w-4 h-4 text-slate-500"></i>
                    `;
                    socialContainer.appendChild(a);
                }
            });

            if (!hasSocial) {
                socialContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">尚未設定社群連結</p>`;
            }

            // Stream Zone Embed
            const streamCard = document.getElementById('streamEmbedCard');
            const streamStatus = document.getElementById('streamStatusBadge');

            if (oshi.streamUrl) {
                let videoId = oshi.streamUrl;
                // Parse Youtube Video ID if full URL is pasted
                if (oshi.streamUrl.includes('v=')) {
                    videoId = oshi.streamUrl.split('v=')[1]?.split('&')[0];
                } else if (oshi.streamUrl.includes('youtu.be/')) {
                    videoId = oshi.streamUrl.split('youtu.be/')[1]?.split('?')[0];
                }

                if (videoId && videoId.length > 5) {
                    streamCard.className = "rounded-xl overflow-hidden bg-slate-950 border border-slate-800 aspect-video relative";
                    streamCard.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    streamStatus.textContent = "已載入預告";
                    streamStatus.className = "text-xs px-2.5 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30";
                } else {
                    renderEmptyStream();
                }
            } else {
                renderEmptyStream();
            }
        }

        function renderEmptyStream() {
            const streamCard = document.getElementById('streamEmbedCard');
            const streamStatus = document.getElementById('streamStatusBadge');
            streamCard.className = "rounded-xl overflow-hidden bg-slate-950 border border-slate-800 aspect-video flex flex-col items-center justify-center p-6 text-center";
            streamCard.innerHTML = `
                <i data-lucide="video-off" class="w-12 h-12 text-slate-600 mb-3"></i>
                <p class="text-slate-400 text-sm">目前暫無設定直播預告資訊</p>
                <p class="text-xs text-slate-600 mt-1">點擊右上角⚙️編輯主推設定</p>
            `;
            streamStatus.textContent = "未設定";
            streamStatus.className = "text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
        }

        // ==================== CALENDAR ENGINE ====================
        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendarView();
        }

        function resetToToday() {
            calendarDate = new Date();
            renderCalendarView();
        }

        function renderCalendarView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            document.getElementById('calendarMonthYear').textContent = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Empty Leading Slots
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "min-h-[60px] sm:min-h-[80px] bg-slate-950/30 rounded-xl border border-slate-800/40 opacity-30";
                grid.appendChild(emptyCell);
            }

            const today = new Date();
            const events = oshi.events || [];

            // Days Rendering
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

                // Check Debut Anniversary match
                let isDebutDay = false;
                if (oshi.debut) {
                    const debutParts = oshi.debut.split('-');
                    if (parseInt(debutParts[1]) === (month + 1) && parseInt(debutParts[2]) === day) {
                        isDebutDay = true;
                    }
                }

                // Filter events on this day
                const dayEvents = events.filter(e => e.date === dateStr);

                const cell = document.createElement('div');
                cell.className = `min-h-[60px] sm:min-h-[80px] p-1.5 rounded-xl border flex flex-col justify-between transition cursor-pointer hover:border-pink-500/50 ${
                    isToday 
                    ? 'bg-pink-950/20 border-pink-500/60 shadow-inner' 
                    : 'bg-slate-950/80 border-slate-800/80'
                }`;
                cell.onclick = () => openEventModal(null, dateStr);

                let badgesHtml = '';
                if (isDebutDay) {
                    badgesHtml += `<div class="text-[10px] bg-purple-500/30 text-purple-300 border border-purple-500/40 rounded px-1 py-0.5 truncate">🎉 出道紀念日</div>`;
                }

                dayEvents.forEach(evt => {
                    let typeBg = 'bg-pink-500/20 text-pink-300 border-pink-500/30';
                    if (evt.type === 'member') typeBg = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
                    if (evt.type === 'wallpaper') typeBg = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
                    if (evt.type === 'anniversary') typeBg = 'bg-purple-500/20 text-purple-300 border-purple-500/30';

                    badgesHtml += `
                        <div onclick="event.stopPropagation(); openEventModal('${evt.id}')" class="text-[10px] ${typeBg} border rounded px-1 py-0.5 truncate hover:scale-105 transition" title="${evt.title}">
                            ${evt.title}
                        </div>
                    `;
                });

                cell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold ${isToday ? 'text-pink-400' : 'text-slate-300'}">${day}</span>
                        ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>' : ''}
                    </div>
                    <div class="space-y-1 overflow-hidden mt-1">
                        ${badgesHtml}
                    </div>
                `;

                grid.appendChild(cell);
            }

            // Render Monthly Event Detailed List
            renderMonthlyList(year, month + 1);
        }

        function renderMonthlyList(year, month) {
            const oshi = getCurrentOshi();
            const container = document.getElementById('monthlyEventsList');
            container.innerHTML = '';

            const currentMonthPrefix = `${year}-${String(month).padStart(2, '0')}`;
            const monthEvents = (oshi.events || []).filter(e => e.date.startsWith(currentMonthPrefix));

            if (monthEvents.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 py-3 text-center">本月份尚無自訂事件紀錄</p>`;
                return;
            }

            // Sort by date ascending
            monthEvents.sort((a, b) => a.date.localeCompare(b.date));

            monthEvents.forEach(evt => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm";
                
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="font-mono text-xs px-2 py-1 rounded bg-slate-800 text-slate-300 font-bold">${evt.date}</span>
                        <div>
                            <span class="font-semibold text-slate-200 block">${evt.title}</span>
                            ${evt.note ? `<span class="text-xs text-slate-400 block">${evt.note}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-1">
                        <button onclick="openEventModal('${evt.id}')" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                            <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="deleteEvent('${evt.id}')" class="p-1.5 text-red-400 hover:text-red-300 rounded-lg hover:bg-red-500/10 transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
            lucide.createIcons();
        }

        // ==================== MERCH TRACKER ENGINE ====================
        function renderMerchView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            const merches = oshi.merches || [];

            // Calculate Grand Total
            const totalSpend = merches.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
            document.getElementById('totalSpendAmount').textContent = `NT$ ${totalSpend.toLocaleString()}`;

            const groupContainer = document.getElementById('merchGroupContainer');
            groupContainer.innerHTML = '';

            if (merches.length === 0) {
                groupContainer.innerHTML = `
                    <div class="bg-slate-900 rounded-2xl border border-slate-800 p-8 text-center">
                        <i data-lucide="shopping-bag" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
                        <p class="text-slate-400 text-sm">尚無任何周邊購買紀錄</p>
                        <p class="text-xs text-slate-600 mt-1">點擊上方按鈕開始新增第一次戰利品！</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // Group by Event Name
            const grouped = {};
            merches.forEach(m => {
                const evtName = m.eventName || '一般戰利品';
                if (!grouped[evtName]) grouped[evtName] = [];
                grouped[evtName].push(m);
            });

            // Render Groups
            Object.keys(grouped).forEach(eventName => {
                const groupItems = grouped[eventName];
                const groupSubtotal = groupItems.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);

                const groupCard = document.createElement('div');
                groupCard.className = "bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg space-y-4";

                let rowsHtml = '';
                groupItems.forEach(item => {
                    const itemTotal = Number(item.price) * Number(item.qty);
                    const imgHtml = item.imgBase64 
                        ? `<img src="${item.imgBase64}" class="w-12 h-12 rounded-lg object-cover border border-slate-700 shrink-0">`
                        : `<div class="w-12 h-12 rounded-lg bg-slate-800 flex items-center justify-center text-slate-500 shrink-0 border border-slate-700/50"><i data-lucide="package" class="w-6 h-6"></i></div>`;

                    rowsHtml += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800/80 gap-3">
                            <div class="flex items-center space-x-3">
                                ${imgHtml}
                                <div>
                                    <span class="font-bold text-slate-200 text-sm block">${item.name}</span>
                                    <div class="text-xs text-slate-400 flex flex-wrap gap-x-3 gap-y-1 mt-0.5">
                                        <span>單價: NT$ ${Number(item.price).toLocaleString()}</span>
                                        <span>數量: ${item.qty}</span>
                                        ${item.channel ? `<span class="text-purple-400">管道: ${item.channel}</span>` : ''}
                                    </div>
                                    ${item.note ? `<p class="text-xs text-slate-500 mt-1">${item.note}</p>` : ''}
                                </div>
                            </div>

                            <div class="flex items-center justify-between sm:justify-end space-x-4 border-t sm:border-t-0 border-slate-800 pt-2 sm:pt-0">
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 block">小計</span>
                                    <span class="text-sm font-extrabold text-pink-400">NT$ ${itemTotal.toLocaleString()}</span>
                                </div>
                                <button onclick="deleteMerch('${item.id}')" class="p-2 text-red-400 hover:text-red-300 rounded-lg hover:bg-red-500/10 transition" title="刪除紀錄">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                groupCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="tag" class="w-4 h-4 text-pink-400"></i>
                            <h3 class="font-bold text-white text-base">${eventName}</h3>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">${groupItems.length} 項</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400 mr-1.5">活動總計:</span>
                            <span class="text-base font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">NT$ ${groupSubtotal.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="space-y-2">
                        ${rowsHtml}
                    </div>
                `;

                groupContainer.appendChild(groupCard);
            });

            lucide.createIcons();
        }

        // ==================== MODAL ACTIONS & FORMS ====================

        // 1. OSHI MODAL HANDLERS
        function openOshiModal(oshiId = null, isOnboarding = false) {
            const modal = document.getElementById('oshiModal');
            const form = document.getElementById('oshiForm');
            const title = document.getElementById('oshiModalTitle');
            const closeBtn = document.getElementById('closeOshiModalBtn');
            const deleteBtn = document.getElementById('deleteOshiBtn');

            form.reset();

            if (isOnboarding) {
                closeBtn.classList.add('hidden');
                deleteBtn.classList.add('hidden');
                title.innerHTML = `<i data-lucide="sparkles" class="w-5 h-5 text-pink-400"></i><span>歡迎！請建立您的第一個主推 VTuber</span>`;
                document.getElementById('oshiIdInput').value = '';
            } else if (oshiId) {
                closeBtn.classList.remove('hidden');
                deleteBtn.classList.remove('hidden');
                title.innerHTML = `<i data-lucide="settings" class="w-5 h-5 text-pink-400"></i><span>編輯主推資料</span>`;

                const oshi = appData.oshis.find(o => o.id === oshiId);
                if (oshi) {
                    document.getElementById('oshiIdInput').value = oshi.id;
                    document.getElementById('oshiNameInput').value = oshi.name || '';
                    document.getElementById('oshiBirthdayInput').value = oshi.birthday || '';
                    document.getElementById('oshiDebutInput').value = oshi.debut || '';
                    document.getElementById('oshiTagsInput').value = oshi.tags || '';
                    document.getElementById('oshiBioInput').value = oshi.bio || '';
                    document.getElementById('oshiStreamInput').value = oshi.streamUrl || '';

                    if (oshi.social) {
                        document.getElementById('socialYouTube').value = oshi.social.youtube || '';
                        document.getElementById('socialTwitter').value = oshi.social.twitter || '';
                        document.getElementById('socialTwitch').value = oshi.social.twitch || '';
                        document.getElementById('socialInstagram').value = oshi.social.instagram || '';
                    }
                }
            } else {
                closeBtn.classList.remove('hidden');
                deleteBtn.classList.add('hidden');
                title.innerHTML = `<i data-lucide="user-plus" class="w-5 h-5 text-pink-400"></i><span>新增主推 VTuber</span>`;
                document.getElementById('oshiIdInput').value = '';
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeOshiModal() {
            if (!appData.oshis || appData.oshis.length === 0) {
                alert('請至少新增一位主推資料以開始使用！');
                return;
            }
            document.getElementById('oshiModal').classList.add('hidden');
        }

        async function saveOshiData(e) {
            e.preventDefault();

            const id = document.getElementById('oshiIdInput').value;
            const name = document.getElementById('oshiNameInput').value.trim();
            const birthday = document.getElementById('oshiBirthdayInput').value.trim();
            const debut = document.getElementById('oshiDebutInput').value;
            const tags = document.getElementById('oshiTagsInput').value.trim();
            const bio = document.getElementById('oshiBioInput').value.trim();
            const streamUrl = document.getElementById('oshiStreamInput').value.trim();

            const avatarFile = document.getElementById('oshiAvatarFile').files[0];
            const coverFile = document.getElementById('oshiCoverFile').files[0];

            let avatarBase64 = null;
            let coverBase64 = null;

            if (avatarFile) avatarBase64 = await fileToBase64(avatarFile, 400);
            if (coverFile) coverBase64 = await fileToBase64(coverFile, 1000);

            const social = {
                youtube: document.getElementById('socialYouTube').value.trim(),
                twitter: document.getElementById('socialTwitter').value.trim(),
                twitch: document.getElementById('socialTwitch').value.trim(),
                instagram: document.getElementById('socialInstagram').value.trim()
            };

            if (id) {
                // Edit Existing
                const oshi = appData.oshis.find(o => o.id === id);
                if (oshi) {
                    oshi.name = name;
                    oshi.birthday = birthday;
                    oshi.debut = debut;
                    oshi.tags = tags;
                    oshi.bio = bio;
                    oshi.streamUrl = streamUrl;
                    oshi.social = social;
                    if (avatarBase64) oshi.avatarBase64 = avatarBase64;
                    if (coverBase64) oshi.coverBase64 = coverBase64;
                }
            } else {
                // Create New
                const newOshi = {
                    id: 'oshi_' + Date.now(),
                    name,
                    birthday,
                    debut,
                    tags,
                    bio,
                    streamUrl,
                    social,
                    avatarBase64,
                    coverBase64,
                    events: [],
                    merches: []
                };
                appData.oshis.push(newOshi);
                appData.currentOshiId = newOshi.id;
            }

            saveToLocalStorage();
            closeOshiModal();
            renderAll();
        }

        function deleteOshi() {
            const id = document.getElementById('oshiIdInput').value;
            if (!id) return;

            if (confirm('確定要刪除這位主推及所有相關的行事曆與周邊紀錄嗎？此動作無法復原。')) {
                appData.oshis = appData.oshis.filter(o => o.id !== id);
                if (appData.oshis.length > 0) {
                    appData.currentOshiId = appData.oshis[0].id;
                } else {
                    appData.currentOshiId = null;
                }

                saveToLocalStorage();
                document.getElementById('oshiModal').classList.add('hidden');

                if (appData.oshis.length === 0) {
                    openOshiModal(null, true);
                } else {
                    renderAll();
                }
            }
        }

        // 2. CALENDAR EVENT MODAL HANDLERS
        function openEventModal(eventId = null, defaultDate = null) {
            const modal = document.getElementById('eventModal');
            const form = document.getElementById('eventForm');
            form.reset();

            if (eventId) {
                const oshi = getCurrentOshi();
                const evt = (oshi.events || []).find(e => e.id === eventId);
                if (evt) {
                    document.getElementById('eventIdInput').value = evt.id;
                    document.getElementById('eventDateInput').value = evt.date;
                    document.getElementById('eventTitleInput').value = evt.title;
                    document.getElementById('eventTypeInput').value = evt.type || 'stream';
                    document.getElementById('eventNoteInput').value = evt.note || '';
                }
            } else {
                document.getElementById('eventIdInput').value = '';
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('eventDateInput').value = defaultDate || todayStr;
            }

            modal.classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        function saveEventData(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (!oshi.events) oshi.events = [];

            const id = document.getElementById('eventIdInput').value;
            const date = document.getElementById('eventDateInput').value;
            const title = document.getElementById('eventTitleInput').value.trim();
            const type = document.getElementById('eventTypeInput').value;
            const note = document.getElementById('eventNoteInput').value.trim();

            if (id) {
                const evt = oshi.events.find(e => e.id === id);
                if (evt) {
                    evt.date = date;
                    evt.title = title;
                    evt.type = type;
                    evt.note = note;
                }
            } else {
                oshi.events.push({
                    id: 'evt_' + Date.now(),
                    date,
                    title,
                    type,
                    note
                });
            }

            saveToLocalStorage();
            closeEventModal();
            renderCalendarView();
        }

        function deleteEvent(eventId) {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (confirm('確定要刪除此行程事件嗎？')) {
                oshi.events = (oshi.events || []).filter(e => e.id !== eventId);
                saveToLocalStorage();
                renderCalendarView();
            }
        }

        // 3. MERCH MODAL HANDLERS
        function openMerchModal() {
            const modal = document.getElementById('merchModal');
            document.getElementById('merchForm').reset();
            document.getElementById('merchIdInput').value = '';
            modal.classList.remove('hidden');
        }

        function closeMerchModal() {
            document.getElementById('merchModal').classList.add('hidden');
        }

        async function saveMerchData(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (!oshi.merches) oshi.merches = [];

            const eventName = document.getElementById('merchEventInput').value.trim();
            const name = document.getElementById('merchNameInput').value.trim();
            const price = Number(document.getElementById('merchPriceInput').value);
            const qty = Number(document.getElementById('merchQtyInput').value);
            const channel = document.getElementById('merchChannelInput').value.trim();
            const note = document.getElementById('merchNoteInput').value.trim();

            const imgFile = document.getElementById('merchImgFile').files[0];
            let imgBase64 = null;
            if (imgFile) imgBase64 = await fileToBase64(imgFile, 500);

            oshi.merches.push({
                id: 'merch_' + Date.now(),
                eventName,
                name,
                price,
                qty,
                channel,
                note,
                imgBase64
            });

            saveToLocalStorage();
            closeMerchModal();
            renderMerchView();
        }

        function deleteMerch(merchId) {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (confirm('確定要刪除此筆周邊紀錄嗎？')) {
                oshi.merches = (oshi.merches || []).filter(m => m.id !== merchId);
                saveToLocalStorage();
                renderMerchView();
            }
        }
    </script>
</body>
