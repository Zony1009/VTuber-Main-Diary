<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshiCenter - VTuber 應援與收藏管理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75',
                            950: '#4a044e',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .gradient-border {
            background: linear-gradient(135deg, #d946ef, #8b5cf6, #3b82f6);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#090d16] text-slate-100 antialiased selection:bg-pink-500 selection:text-white">

    <!-- Top Layer Navigation: Oshi Switcher Header -->
    <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-2">
                <!-- Logo / Dynamic Title (Requirement 1) -->
                <div class="flex items-center space-x-3 cursor-pointer shrink-0" onclick="switchTab('home')">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-pink-500/30">
                        <i data-lucide="heart" class="w-6 h-6 fill-current"></i>
                    </div>
                    <div>
                        <!-- Title Swapped: Pink Current Oshi Name (or Fallback), Gray OshiCenter -->
                        <span id="headerOshiTitle" class="font-bold text-base sm:text-lg bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 bg-clip-text text-transparent block truncate max-w-[150px] sm:max-w-xs">
                            VTuber 應援與收藏管理
                        </span>
                        <span class="text-xs text-slate-400 block font-medium">OshiCenter</span>
                    </div>
                </div>

                <!-- First Layer: VTuber Switcher Tabs -->
                <div class="flex items-center space-x-2 overflow-x-auto py-2 no-scrollbar max-w-[35vw] sm:max-w-md lg:max-w-lg" id="oshiTabsContainer">
                    <!-- Dynamic Oshi Tabs will be inserted here -->
                </div>

                <!-- Action Buttons: Add New Oshi & User Account Switcher -->
                <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
                    <button onclick="openOshiModal()" class="flex items-center space-x-1.5 px-3 py-2 min-h-[44px] rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white text-xs sm:text-sm font-medium transition shadow-md shadow-pink-500/20 active:scale-95">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">新增主推</span>
                        <span class="sm:hidden">新增</span>
                    </button>

                    <!-- Fixed Edit Current Oshi Button -->
                    <button onclick="editCurrentOshi()" id="editOshiBtn" title="編輯當前主推" class="p-2.5 min-h-[44px] min-w-[44px] flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition border border-slate-700 active:scale-95">
                        <i data-lucide="settings" class="w-4.5 h-4.5"></i>
                    </button>

                    <!-- User Account Badge / Switcher (Requirement 2) -->
                    <button onclick="openUserModal()" title="切換帳號" class="flex items-center space-x-1 px-2.5 py-2 min-h-[44px] rounded-xl bg-slate-800/80 hover:bg-slate-700 text-purple-300 hover:text-purple-200 transition border border-purple-500/30 active:scale-95 text-xs">
                        <i data-lucide="user-check" class="w-4 h-4 text-purple-400"></i>
                        <span id="currentUsernameDisplay" class="font-semibold max-w-[60px] sm:max-w-[100px] truncate">訪客</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Second Layer: Function Sub-Tabs -->
        <nav class="bg-slate-950/90 border-t border-slate-800/80">
            <div class="max-w-7xl mx-auto px-4 flex justify-center sm:justify-start space-x-2 sm:space-x-4">
                <button onclick="switchTab('home')" id="tabBtn-home" class="subtab-btn flex items-center space-x-2 px-4 py-3 min-h-[44px] text-xs sm:text-sm font-medium border-b-2 border-pink-500 text-pink-400 transition">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>主頁</span>
                </button>
                <button onclick="switchTab('calendar')" id="tabBtn-calendar" class="subtab-btn flex items-center space-x-2 px-4 py-3 min-h-[44px] text-xs sm:text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <span>行事曆</span>
                </button>
                <button onclick="switchTab('merch')" id="tabBtn-merch" class="subtab-btn flex items-center space-x-2 px-4 py-3 min-h-[44px] text-xs sm:text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>周邊紀錄</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ==================== TAB 1: HOME ==================== -->
        <section id="view-home" class="space-y-6">
            <!-- Banner & Profile Header Section -->
            <div class="relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl">
                <!-- Cover Image / Banner -->
                <div class="h-44 sm:h-64 min-h-[180px] w-full bg-gradient-to-r from-purple-900 via-indigo-900 to-slate-900 relative overflow-hidden">
                    <img id="homeCoverImg" src="" alt="Cover Banner" class="w-full h-full object-cover hidden">
                    <div id="homeCoverPlaceholder" class="w-full h-full flex items-center justify-center text-slate-600 bg-slate-800/50">
                        <i data-lucide="image" class="w-12 h-12 stroke-[1.5]"></i>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/20"></div>
                </div>

                <!-- Profile Info Overlay Container -->
                <div class="relative px-4 sm:px-6 pb-6 pt-0 sm:pt-4">
                    <div class="flex flex-col sm:flex-row items-center sm:items-end space-y-4 sm:space-y-0 sm:space-x-6 -mt-16 sm:-mt-24 mb-4">
                        <!-- Avatar -->
                        <div class="relative w-28 h-28 sm:w-36 sm:h-36 rounded-2xl p-1 gradient-border shadow-xl shrink-0 bg-slate-900">
                            <div class="w-full h-full rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center">
                                <img id="homeAvatarImg" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                                <div id="homeAvatarPlaceholder" class="text-slate-500">
                                    <i data-lucide="user" class="w-14 h-14"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Name & Dates -->
                        <div class="flex-1 text-center sm:text-left space-y-2">
                            <h1 id="homeName" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide"></h1>
                            <div class="flex flex-wrap justify-center sm:justify-start gap-2 text-xs sm:text-sm">
                                <span id="homeBirthdayBadge" class="hidden items-center px-3 py-1.5 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-300">
                                    <i data-lucide="cake" class="w-3.5 h-3.5 mr-1.5"></i>
                                    <span id="homeBirthdayText"></span>
                                </span>
                                <span id="homeDebutBadge" class="hidden items-center px-3 py-1.5 rounded-full bg-purple-500/10 border border-purple-500/30 text-purple-300">
                                    <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-1.5"></i>
                                    <span id="homeDebutText"></span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Tags Bar -->
                    <div id="homeTagsContainer" class="flex flex-wrap gap-2 mb-4 justify-center sm:justify-start"></div>

                    <!-- Bio Section -->
                    <div id="homeBioCard" class="hidden mt-4 p-4 rounded-xl bg-slate-800/50 border border-slate-700/60 text-slate-300 text-xs sm:text-sm leading-relaxed">
                        <p id="homeBioText" class="whitespace-pre-line"></p>
                    </div>
                </div>
            </div>

            <!-- Social Links & Live Stream Section Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Social Links -->
                <div class="lg:col-span-1 bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-5 shadow-lg flex flex-col justify-between">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-white mb-4 flex items-center space-x-2">
                            <i data-lucide="share-2" class="w-5 h-5 text-pink-400"></i>
                            <span>社群連結</span>
                        </h2>
                        <div id="socialLinksContainer" class="space-y-2.5">
                            <!-- Dynamic Social Buttons -->
                        </div>
                    </div>
                </div>

                <!-- Live Stream Preview Zone -->
                <div class="lg:col-span-2 bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-5 shadow-lg flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-base sm:text-lg font-bold text-white flex items-center space-x-2">
                                <i data-lucide="tv" class="w-5 h-5 text-red-400"></i>
                                <span>直播預告 / 待機所</span>
                            </h2>
                            <span id="streamStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">未設定</span>
                        </div>

                        <div id="streamEmbedCard" class="rounded-xl overflow-hidden bg-slate-950 border border-slate-800 aspect-video flex flex-col items-center justify-center p-6 text-center">
                            <i data-lucide="video-off" class="w-12 h-12 text-slate-600 mb-3"></i>
                            <p class="text-slate-400 text-sm" id="streamMessage">目前暫無設定直播資訊，點擊右上角⚙️按鈕進行設定</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ==================== TAB 2: CALENDAR ==================== -->
        <section id="view-calendar" class="hidden space-y-6">
            <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-6 shadow-xl">
                <!-- Calendar Header & Navigation -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                    <div class="flex items-center space-x-3 w-full sm:w-auto">
                        <div class="p-2.5 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20 shrink-0">
                            <i data-lucide="calendar-days" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h2 id="calendarMonthYear" class="text-lg sm:text-xl font-bold text-white">2026 年 10 月</h2>
                            <p class="text-xs text-slate-400">活動記錄、紀念日與重大事項</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="flex items-center space-x-1 bg-slate-800 rounded-xl p-1 border border-slate-700">
                            <button onclick="changeMonth(-1)" class="p-2 min-h-[44px] min-w-[44px] flex items-center justify-center hover:bg-slate-700 rounded-lg text-slate-300 transition"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                            <button onclick="resetToToday()" class="px-3 py-2 min-h-[44px] hover:bg-slate-700 rounded-lg text-xs font-medium text-slate-300 transition">今天</button>
                            <button onclick="changeMonth(1)" class="p-2 min-h-[44px] min-w-[44px] flex items-center justify-center hover:bg-slate-700 rounded-lg text-slate-300 transition"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                        </div>
                        <button onclick="openEventModal()" class="flex items-center space-x-1.5 px-3 py-2.5 min-h-[44px] rounded-xl bg-pink-600 hover:bg-pink-700 text-white text-xs sm:text-sm font-medium transition shadow-md">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>新增事件</span>
                        </button>
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2 text-center text-xs font-bold text-slate-400 border-b border-slate-800 pb-2">
                    <div class="text-red-400">日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div class="text-indigo-400">六</div>
                </div>
                
                <div id="calendarGrid" class="grid grid-cols-7 gap-1 sm:gap-2 min-h-[320px]">
                    <!-- Dynamic Calendar Days -->
                </div>
            </div>

            <!-- Event Details / List Card -->
            <div class="bg-slate-900 rounded-2xl border border-slate-800 p-4 sm:p-5 shadow-lg">
                <h3 class="text-sm sm:text-base font-bold text-slate-200 mb-3 flex items-center space-x-2">
                    <i data-lucide="list-todo" class="w-4 h-4 text-pink-400"></i>
                    <span>本月事件明細</span>
                </h3>
                <div id="monthlyEventsList" class="space-y-2">
                    <!-- Dynamic Event Items -->
                </div>
            </div>
        </section>

        <!-- ==================== TAB 3: MERCH TRACKER ==================== -->
        <section id="view-merch" class="hidden space-y-6">
            <!-- Total Expense Banner Card -->
            <div class="bg-gradient-to-r from-purple-900/40 via-slate-900 to-pink-900/30 rounded-2xl border border-purple-500/30 p-5 sm:p-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-4 w-full sm:w-auto">
                    <div class="p-3.5 rounded-2xl bg-pink-500/20 text-pink-400 border border-pink-500/30 shrink-0">
                        <i data-lucide="wallet" class="w-7 h-7 sm:w-8 sm:h-8"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">全站累積總消費金額</div>
                        <div id="totalSpendAmount" class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-300">NT$ 0</div>
                    </div>
                </div>
                <button onclick="openMerchModal()" class="w-full sm:w-auto flex items-center justify-center space-x-2 px-5 py-3 min-h-[44px] rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium text-xs sm:text-sm shadow-lg transition active:scale-95">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                    <span>紀錄新周邊</span>
                </button>
            </div>

            <!-- Merch Items Grouped by Event -->
            <div id="merchGroupContainer" class="space-y-6">
                <!-- Grouped Merch Tables rendered dynamically -->
            </div>
        </section>

    </main>

    <!-- ==================== MODALS ==================== -->

    <!-- 0. USER LOGIN / SWITCHER MODAL (Requirement 2) -->
    <div id="userModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <h2 class="text-lg font-bold text-white mb-1 flex items-center space-x-2">
                <i data-lucide="users" class="w-5 h-5 text-purple-400"></i>
                <span>使用者帳號登入 / 切換</span>
            </h2>
            <p class="text-xs text-slate-400 mb-5">請輸入您的個人帳號名稱（如：Zony）。每個帳號將隔離儲存各自的主推資料與周邊花費。</p>

            <form onsubmit="switchUserAccount(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">帳號名稱 / 暱稱 *</label>
                    <input type="text" id="usernameInput" required placeholder="例如：Zony 或 Mith" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500 min-h-[44px]">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeUserModal()" id="closeUserModalBtn" class="px-4 py-2.5 min-h-[44px] rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs sm:text-sm font-medium">取消</button>
                    <button type="submit" class="px-5 py-2.5 min-h-[44px] rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white font-medium text-xs sm:text-sm shadow-md transition">切換並載入</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 1. OSHI SETUP MODAL (Requirement 3: Enhanced Form & UI/UX) -->
    <div id="oshiModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-4 sm:p-6 shadow-2xl relative my-6">
            <button onclick="closeOshiModal()" id="closeOshiModalBtn" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white rounded-xl hover:bg-slate-800 transition min-h-[44px] min-w-[44px] flex items-center justify-center">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 id="oshiModalTitle" class="text-lg sm:text-xl font-bold text-white mb-1 flex items-center space-x-2">
                <i data-lucide="user-plus" class="w-5 h-5 text-pink-400"></i>
                <span>新增主推 VTuber</span>
            </h2>
            <p class="text-xs text-slate-400 mb-5">填寫基本資料與設定，支援預覽圖片上傳與自訂社群連結。</p>

            <form id="oshiForm" onsubmit="saveOshiData(event)" class="space-y-4">
                <input type="hidden" id="oshiIdInput">

                <!-- Avatar Upload & Cover Upload with Realtime Preview (Requirement 3) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Avatar Upload -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">形象大頭貼 (圖片檔)</label>
                        <div class="flex items-center space-x-3 bg-slate-900/80 border border-slate-700 rounded-xl p-2">
                            <div id="avatarPreviewContainer" class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
                                <i data-lucide="user" class="w-6 h-6 text-slate-500" id="avatarPreviewFallback"></i>
                                <img id="avatarPreviewImg" class="w-full h-full object-cover hidden" alt="Avatar Preview">
                            </div>
                            <div class="flex-1 min-w-0">
                                <input type="file" id="oshiAvatarFile" accept="image/*" onchange="previewFile(this, 'avatarPreviewImg', 'avatarPreviewFallback')" class="hidden">
                                <label for="oshiAvatarFile" class="inline-block px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-slate-200 cursor-pointer transition font-medium">選擇圖片</label>
                                <button type="button" onclick="clearImagePreview('oshiAvatarFile', 'avatarPreviewImg', 'avatarPreviewFallback')" class="text-[11px] text-red-400 hover:underline ml-2">清除</button>
                            </div>
                        </div>
                    </div>

                    <!-- Cover Upload -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">背景封面圖 (圖片檔)</label>
                        <div class="flex items-center space-x-3 bg-slate-900/80 border border-slate-700 rounded-xl p-2">
                            <div id="coverPreviewContainer" class="w-16 h-12 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
                                <i data-lucide="image" class="w-6 h-6 text-slate-500" id="coverPreviewFallback"></i>
                                <img id="coverPreviewImg" class="w-full h-full object-cover hidden" alt="Cover Preview">
                            </div>
                            <div class="flex-1 min-w-0">
                                <input type="file" id="oshiCoverFile" accept="image/*" onchange="previewFile(this, 'coverPreviewImg', 'coverPreviewFallback')" class="hidden">
                                <label for="oshiCoverFile" class="inline-block px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-xs text-slate-200 cursor-pointer transition font-medium">選擇圖片</label>
                                <button type="button" onclick="clearImagePreview('oshiCoverFile', 'coverPreviewImg', 'coverPreviewFallback')" class="text-[11px] text-red-400 hover:underline ml-2">清除</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Name & Date Pickers (Requirement 3: Date Picker) -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">名稱 *</label>
                        <input type="text" id="oshiNameInput" required placeholder="如：浠 Mizuki" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500 min-h-[44px]">
                    </div>
                    <div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script>
        // Multi-user Account State (Requirement 2)
        let currentUser = localStorage.getItem('OSHI_CENTER_CURRENT_USER') || '';
        
        // Global App Data State
        let appData = {
            currentOshiId: null,
            oshis: []
        };

        // Form Temporary States for Tags and Social Links (Requirement 3)
        let tempTagsList = [];
        let tempSocialList = [];

        // Calendar Logic State
        let calendarDate = new Date();

        // --- Core Startup & Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) {
                openUserModal(true);
            } else {
                loadUserData(currentUser);
            }
        });

        // Requirement 2: Account Multi-user Storage Management
        function getStorageKey(username) {
            return `oshi_data_${username.toLowerCase().trim()}`;
        }

        function loadUserData(username) {
            currentUser = username.trim();
            localStorage.setItem('OSHI_CENTER_CURRENT_USER', currentUser);
            document.getElementById('currentUsernameDisplay').textContent = currentUser;

            const key = getStorageKey(currentUser);
            const data = localStorage.getItem(key);

            if (data) {
                try {
                    appData = JSON.parse(data);
                } catch (e) {
                    console.error('Parse user data error', e);
                    appData = { currentOshiId: null, oshis: [] };
                }
            } else {
                appData = { currentOshiId: null, oshis: [] };
            }

            // Check onboarding for new account
            if (!appData.oshis || appData.oshis.length === 0) {
                openOshiModal(null, true);
            } else {
                if (!appData.currentOshiId && appData.oshis.length > 0) {
                    appData.currentOshiId = appData.oshis[0].id;
                }
                renderAll();
            }
        }

        function saveToLocalStorage() {
            if (!currentUser) return;
            try {
                const key = getStorageKey(currentUser);
                localStorage.setItem(key, JSON.stringify(appData));
            } catch (e) {
                console.error('LocalStorage error:', e);
                alert('無法儲存資料，可能上傳的圖片容量過大，請更換較小檔案。');
            }
        }

        // Account Switcher Handlers (Requirement 2)
        function openUserModal(isForced = false) {
            const modal = document.getElementById('userModal');
            const closeBtn = document.getElementById('closeUserModalBtn');
            const input = document.getElementById('usernameInput');

            input.value = currentUser || '';

            if (isForced) {
                closeBtn.classList.add('hidden');
            } else {
                closeBtn.classList.remove('hidden');
            }

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeUserModal() {
            if (!currentUser) {
                alert('請輸入您的暱稱以建立或載入專屬帳號！');
                return;
            }
            document.getElementById('userModal').classList.add('hidden');
        }

        function switchUserAccount(e) {
            e.preventDefault();
            const inputName = document.getElementById('usernameInput').value.trim();
            if (!inputName) return;

            closeUserModal();
            loadUserData(inputName);
        }

        // --- Helper Functions ---
        function fileToBase64(file, maxWidth = 800) {
            return new Promise((resolve, reject) => {
                if (!file) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                        resolve(compressedBase64);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        function getCurrentOshi() {
            return appData.oshis.find(o => o.id === appData.currentOshiId) || null;
        }

        // Requirement 1: Edit Current Active Oshi Helper
        function editCurrentOshi() {
            if (appData.currentOshiId) {
                openOshiModal(appData.currentOshiId);
            } else {
                openOshiModal(null);
            }
        }

        // --- Render Engine ---
        function renderAll() {
            renderHeaderTitle();
            renderOshiTabs();
            renderHomeView();
            renderCalendarView();
            renderMerchView();
            lucide.createIcons();
        }

        // Requirement 1: Dynamic Top Title Swapped
        function renderHeaderTitle() {
            const oshi = getCurrentOshi();
            const headerTitle = document.getElementById('headerOshiTitle');
            if (oshi && oshi.name) {
                headerTitle.textContent = oshi.name;
            } else {
                headerTitle.textContent = 'VTuber 應援與收藏管理';
            }
        }

        // Render Top Oshi Selector Tabs
        function renderOshiTabs() {
            const container = document.getElementById('oshiTabsContainer');
            container.innerHTML = '';

            appData.oshis.forEach(oshi => {
                const isActive = oshi.id === appData.currentOshiId;
                const btn = document.createElement('button');
                btn.onclick = () => switchOshi(oshi.id);
                btn.className = `flex items-center space-x-2 px-3 py-1.5 min-h-[44px] rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap border shrink-0 ${
                    isActive 
                    ? 'bg-pink-500/20 text-pink-300 border-pink-500/50 shadow-md' 
                    : 'bg-slate-800/60 text-slate-400 hover:text-slate-200 border-slate-700/50 hover:bg-slate-800'
                }`;

                let avatarHtml = `<div class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[10px] text-slate-300 font-bold">${oshi.name.charAt(0)}</div>`;
                if (oshi.avatarBase64) {
                    avatarHtml = `<img src="${oshi.avatarBase64}" class="w-5 h-5 rounded-full object-cover">`;
                }

                btn.innerHTML = `${avatarHtml}<span>${oshi.name}</span>`;
                container.appendChild(btn);
            });
        }

        function switchOshi(id) {
            appData.currentOshiId = id;
            saveToLocalStorage();
            renderAll();
        }

        function switchTab(tabName) {
            document.querySelectorAll('section[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.subtab-btn').forEach(btn => {
                btn.classList.remove('border-pink-500', 'text-pink-400');
                btn.classList.add('border-transparent', 'text-slate-400');
            });

            const activeBtn = document.getElementById(`tabBtn-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
                activeBtn.classList.add('border-pink-500', 'text-pink-400');
            }
        }

        // ==================== HOME VIEW RENDERER ====================
        function renderHomeView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            document.getElementById('homeName').textContent = oshi.name || '未命名主推';

            // Cover Banner
            const coverImg = document.getElementById('homeCoverImg');
            const coverPlaceholder = document.getElementById('homeCoverPlaceholder');
            if (oshi.coverBase64) {
                coverImg.src = oshi.coverBase64;
                coverImg.classList.remove('hidden');
                coverPlaceholder.classList.add('hidden');
            } else {
                coverImg.classList.add('hidden');
                coverPlaceholder.classList.remove('hidden');
            }

            // Avatar
            const avatarImg = document.getElementById('homeAvatarImg');
            const avatarPlaceholder = document.getElementById('homeAvatarPlaceholder');
            if (oshi.avatarBase64) {
                avatarImg.src = oshi.avatarBase64;
                avatarImg.classList.remove('hidden');
                avatarPlaceholder.classList.add('hidden');
            } else {
                avatarImg.classList.add('hidden');
                avatarPlaceholder.classList.remove('hidden');
            }

            // Birthday
            const bdayBadge = document.getElementById('homeBirthdayBadge');
            if (oshi.birthday) {
                document.getElementById('homeBirthdayText').textContent = `生日：${oshi.birthday}`;
                bdayBadge.classList.remove('hidden');
                bdayBadge.classList.add('flex');
            } else {
                bdayBadge.classList.add('hidden');
            }

            // Debut Date
            const debutBadge = document.getElementById('homeDebutBadge');
            if (oshi.debut) {
                document.getElementById('homeDebutText').textContent = `出道日：${oshi.debut}`;
                debutBadge.classList.remove('hidden');
                debutBadge.classList.add('flex');
            } else {
                debutBadge.classList.add('hidden');
            }

            // Tags
            const tagsContainer = document.getElementById('homeTagsContainer');
            tagsContainer.innerHTML = '';
            if (oshi.tags && Array.isArray(oshi.tags)) {
                oshi.tags.forEach(tag => {
                    const tagEl = document.createElement('span');
                    tagEl.className = 'px-2.5 py-1 rounded-lg bg-slate-800 border border-slate-700 text-xs text-slate-300 font-medium';
                    tagEl.textContent = `# ${tag}`;
                    tagsContainer.appendChild(tagEl);
                });
            }

            // Bio
            const bioCard = document.getElementById('homeBioCard');
            if (oshi.bio) {
                document.getElementById('homeBioText').textContent = oshi.bio;
                bioCard.classList.remove('hidden');
            } else {
                bioCard.classList.add('hidden');
            }

            // Requirement 3: Dynamic Social Links Render
            const socialContainer = document.getElementById('socialLinksContainer');
            socialContainer.innerHTML = '';
            
            const platformMeta = {
                youtube: { label: 'YouTube 頻道', icon: 'youtube', color: 'hover:bg-red-500/20 hover:border-red-500/50 hover:text-red-300' },
                twitter: { label: 'X (Twitter)', icon: 'twitter', color: 'hover:bg-sky-500/20 hover:border-sky-500/50 hover:text-sky-300' },
                twitch: { label: 'Twitch 實況', icon: 'tv', color: 'hover:bg-purple-500/20 hover:border-purple-500/50 hover:text-purple-300' },
                instagram: { label: 'Instagram', icon: 'instagram', color: 'hover:bg-pink-500/20 hover:border-pink-500/50 hover:text-pink-300' },
                tiktok: { label: 'TikTok', icon: 'video', color: 'hover:bg-teal-500/20 hover:border-teal-500/50 hover:text-teal-300' },
                discord: { label: 'Discord 群組', icon: 'message-square', color: 'hover:bg-indigo-500/20 hover:border-indigo-500/50 hover:text-indigo-300' },
                marshmallow: { label: '棉花糖 (Marshmallow)', icon: 'mail', color: 'hover:bg-amber-500/20 hover:border-amber-500/50 hover:text-amber-300' }
            };

            const links = oshi.socialLinks || [];

            if (links.length > 0) {
                links.forEach(item => {
                    const meta = platformMeta[item.platform] || { label: item.platform, icon: 'link', color: 'hover:bg-slate-800' };
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    a.className = `flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm text-slate-200 transition min-h-[44px] ${meta.color}`;
                    a.innerHTML = `
                        <div class="flex items-center space-x-3">

        // ==================== CALENDAR ENGINE ====================
        function changeMonth(delta) {
            calendarDate.setMonth(calendarDate.getMonth() + delta);
            renderCalendarView();
        }

        function resetToToday() {
            calendarDate = new Date();
            renderCalendarView();
        }

        function renderCalendarView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            const year = calendarDate.getFullYear();
            const month = calendarDate.getMonth();

            document.getElementById('calendarMonthYear').textContent = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "min-h-[50px] sm:min-h-[75px] bg-slate-950/30 rounded-xl border border-slate-800/40 opacity-30";
                grid.appendChild(emptyCell);
            }

            const today = new Date();
            const events = oshi.events || [];

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

                let isDebutDay = false;
                if (oshi.debut) {
                    const debutParts = oshi.debut.split('-');
                    if (parseInt(debutParts[1]) === (month + 1) && parseInt(debutParts[2]) === day) {
                        isDebutDay = true;
                    }
                }

                const dayEvents = events.filter(e => e.date === dateStr);

                const cell = document.createElement('div');
                cell.className = `min-h-[50px] sm:min-h-[75px] p-1 sm:p-1.5 rounded-xl border flex flex-col justify-between transition cursor-pointer hover:border-pink-500/50 ${
                    isToday 
                    ? 'bg-pink-950/20 border-pink-500/60 shadow-inner' 
                    : 'bg-slate-950/80 border-slate-800/80'
                }`;
                cell.onclick = () => openEventModal(null, dateStr);

                let badgesHtml = '';
                if (isDebutDay) {
                    badgesHtml += `<div class="text-[9px] sm:text-[10px] bg-purple-500/30 text-purple-300 border border-purple-500/40 rounded px-1 py-0.5 truncate">🎉 出道</div>`;
                }

                dayEvents.forEach(evt => {
                    let typeBg = 'bg-pink-500/20 text-pink-300 border-pink-500/30';
                    if (evt.type === 'member') typeBg = 'bg-blue-500/20 text-blue-300 border-blue-500/30';
                    if (evt.type === 'wallpaper') typeBg = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
                    if (evt.type === 'anniversary') typeBg = 'bg-purple-500/20 text-purple-300 border-purple-500/30';

                    badgesHtml += `
                        <div onclick="event.stopPropagation(); openEventModal('${evt.id}')" class="text-[9px] sm:text-[10px] ${typeBg} border rounded px-1 py-0.5 truncate hover:scale-105 transition" title="${evt.title}">
                            ${evt.title}
                        </div>
                    `;
                });

                cell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold ${isToday ? 'text-pink-400' : 'text-slate-300'}">${day}</span>
                        ${isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>' : ''}
                    </div>
                    <div class="space-y-0.5 sm:space-y-1 overflow-hidden mt-0.5">
                        ${badgesHtml}
                    </div>
                `;

                grid.appendChild(cell);
            }

            renderMonthlyList(year, month + 1);
        }

        // Requirement 3: File Preview Realtime Helper
        function previewFile(input, imgId, fallbackId) {
            const file = input.files[0];
            const imgEl = document.getElementById(imgId);
            const fallbackEl = document.getElementById(fallbackId);

            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imgEl.src = e.target.result;
                    imgEl.classList.remove('hidden');
                    if (fallbackEl) fallbackEl.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImagePreview(inputId, imgId, fallbackId) {
            document.getElementById(inputId).value = '';
            const imgEl = document.getElementById(imgId);
            const fallbackEl = document.getElementById(fallbackId);
            imgEl.src = '';
            imgEl.classList.add('hidden');
            if (fallbackEl) fallbackEl.classList.remove('hidden');
        }

                addTagFromInput();

                tempTagsList.push(val);
                renderTagsChips();

        // 1. OSHI MODAL HANDLERS
        function openOshiModal(oshiId = null, isOnboarding = false) {
            const modal = document.getElementById('oshiModal');
            const form = document.getElementById('oshiForm');
            const title = document.getElementById('oshiModalTitle');
            const closeBtn = document.getElementById('closeOshiModalBtn');
            const deleteBtn = document.getElementById('deleteOshiBtn');

            form.reset();
            tempTagsList = [];
            tempSocialList = [];

            clearImagePreview('oshiAvatarFile', 'avatarPreviewImg', 'avatarPreviewFallback');
            clearImagePreview('oshiCoverFile', 'coverPreviewImg', 'coverPreviewFallback');

            if (isOnboarding) {
                closeBtn.classList.add('hidden');
                deleteBtn.classList.add('hidden');
                title.innerHTML = `<i data-lucide="sparkles" class="w-5 h-5 text-pink-400"></i><span>歡迎！請建立您的第一個主推 VTuber</span>`;
                document.getElementById('oshiIdInput').value = '';
            } else if (oshiId) {
                closeBtn.classList.remove('hidden');
                deleteBtn.classList.remove('hidden');
                title.innerHTML = `<i data-lucide="settings" class="w-5 h-5 text-pink-400"></i><span>編輯主推資料</span>`;

                const oshi = appData.oshis.find(o => o.id === oshiId);
                if (oshi) {
                    document.getElementById('oshiIdInput').value = oshi.id;
                    document.getElementById('oshiNameInput').value = oshi.name || '';
                    document.getElementById('oshiBirthdayInput').value = oshi.birthday || '';
                    document.getElementById('oshiDebutInput').value = oshi.debut || '';
                    document.getElementById('oshiBioInput').value = oshi.bio || '';
                    document.getElementById('oshiStreamInput').value = oshi.streamUrl || '';

                    // Load Tags
                    if (Array.isArray(oshi.tags)) {
                        tempTagsList = [...oshi.tags];
                    } else if (typeof oshi.tags === 'string' && oshi.tags.trim()) {
                        tempTagsList = oshi.tags.split(',').map(t => t.trim()).filter(Boolean);
                    }

                    // Load Social Links
                    if (Array.isArray(oshi.socialLinks)) {
                        tempSocialList = [...oshi.socialLinks];
                    }

                    // Load Image Previews
                    if (oshi.avatarBase64) {
                        const avatarImg = document.getElementById('avatarPreviewImg');
                        avatarImg.src = oshi.avatarBase64;
                        avatarImg.classList.remove('hidden');
                        document.getElementById('avatarPreviewFallback').classList.add('hidden');
                    }
                    if (oshi.coverBase64) {
                        const coverImg = document.getElementById('coverPreviewImg');
                        coverImg.src = oshi.coverBase64;
                        coverImg.classList.remove('hidden');
                        document.getElementById('coverPreviewFallback').classList.add('hidden');

                deleteBtn.classList.add('hidden');
                title.innerHTML = `<i data-lucide="user-plus" class="w-5 h-5 text-pink-400"></i><span>新增主推 VTuber</span>`;
                document.getElementById('oshiIdInput').value = '';
            }

            renderTagsChips();
            renderSocialListInForm();

            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeOshiModal() {
            if (!appData.oshis || appData.oshis.length === 0) {
                alert('請至少新增一位主推資料以開始使用！');
                return;
            }
            document.getElementById('oshiModal').classList.add('hidden');
        }

        async function saveOshiData(e) {
            e.preventDefault();

            const id = document.getElementById('oshiIdInput').value;
            const name = document.getElementById('oshiNameInput').value.trim();
            const birthday = document.getElementById('oshiBirthdayInput').value;
            const debut = document.getElementById('oshiDebutInput').value;
            const bio = document.getElementById('oshiBioInput').value.trim();
            const streamUrl = document.getElementById('oshiStreamInput').value.trim();

            const avatarFile = document.getElementById('oshiAvatarFile').files[0];
            const coverFile = document.getElementById('oshiCoverFile').files[0];

            let avatarBase64 = null;
            let coverBase64 = null;

            if (avatarFile) avatarBase64 = await fileToBase64(avatarFile, 400);
            if (coverFile) coverBase64 = await fileToBase64(coverFile, 1000);

            if (id) {
                // Edit Existing
                const oshi = appData.oshis.find(o => o.id === id);
                if (oshi) {
                    oshi.name = name;
                    oshi.birthday = birthday;
                    oshi.debut = debut;
                    oshi.tags = [...tempTagsList];
                    oshi.bio = bio;
                    oshi.streamUrl = streamUrl;
                    oshi.socialLinks = [...tempSocialList];
                    if (avatarBase64) oshi.avatarBase64 = avatarBase64;
                    if (coverBase64) oshi.coverBase64 = coverBase64;
                }
            } else {
                // Create New
                const newOshi = {
                    id: 'oshi_' + Date.now(),
                    name,
                    birthday,
                    debut,
                    tags: [...tempTagsList],
                    bio,
                    streamUrl,
                    socialLinks: [...tempSocialList],
                    avatarBase64,
                    coverBase64,
                    events: [],
                    merches: []
                };
                appData.oshis.push(newOshi);
                appData.currentOshiId = newOshi.id;
            }

            saveToLocalStorage();
            document.getElementById('oshiModal').classList.add('hidden');
            renderAll();
        }

        function deleteOshi() {
            const id = document.getElementById('oshiIdInput').value;
            if (!id) return;

            if (confirm('確定要刪除這位主推及所有相關的行事曆與周邊紀錄嗎？此動作無法復原。')) {
                appData.oshis = appData.oshis.filter(o => o.id !== id);
                if (appData.oshis.length > 0) {
                    appData.currentOshiId = appData.oshis[0].id;
                } else {
                    appData.currentOshiId = null;
                }

                saveToLocalStorage();
                document.getElementById('oshiModal').classList.add('hidden');

                if (appData.oshis.length === 0) {
                    openOshiModal(null, true);
                } else {
                    renderAll();
                }
            }
        }

        // 2. CALENDAR EVENT MODAL HANDLERS
        function openEventModal(eventId = null, defaultDate = null) {
            const modal = document.getElementById('eventModal');
            const form = document.getElementById('eventForm');
            form.reset();

            if (eventId) {
                const oshi = getCurrentOshi();
                const evt = (oshi.events || []).find(e => e.id === eventId);
                if (evt) {
                    document.getElementById('eventIdInput').value = evt.id;
                    document.getElementById('eventDateInput').value = evt.date;
                    document.getElementById('eventTitleInput').value = evt.title;
                    document.getElementById('eventTypeInput').value = evt.type || 'stream';
                    document.getElementById('eventNoteInput').value = evt.note || '';
                }
            } else {
                document.getElementById('eventIdInput').value = '';
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('eventDateInput').value = defaultDate || todayStr;
            }

            modal.classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        function saveEventData(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (!oshi.events) oshi.events = [];

            const id = document.getElementById('eventIdInput').value;
            const date = document.getElementById('eventDateInput').value;
            const title = document.getElementById('eventTitleInput').value.trim();
            const type = document.getElementById('eventTypeInput').value;
            const note = document.getElementById('eventNoteInput').value.trim();

            if (id) {
                const evt = oshi.events.find(e => e.id === id);
                if (evt) {
                    evt.date = date;
                    evt.title = title;
                    evt.type = type;
                    evt.note = note;
                }
            } else {
                oshi.events.push({
                    id: 'evt_' + Date.now(),
                    date,
                    title,
                    type,
                    note
                });
            }

            saveToLocalStorage();
            closeEventModal();
            renderCalendarView();
        }

        function deleteEvent(eventId) {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (confirm('確定要刪除此行程事件嗎？')) {
                oshi.events = (oshi.events || []).filter(e => e.id !== eventId);
                saveToLocalStorage();
                renderCalendarView();
            }
        }

        // 3. MERCH MODAL HANDLERS
        function openMerchModal() {
            const modal = document.getElementById('merchModal');
            document.getElementById('merchForm').reset();
            document.getElementById('merchIdInput').value = '';
            modal.classList.remove('hidden');
        }

        function closeMerchModal() {
            document.getElementById('merchModal').classList.add('hidden');
        }

        async function saveMerchData(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (!oshi.merches) oshi.merches = [];

            const eventName = document.getElementById('merchEventInput').value.trim();
            const name = document.getElementById('merchNameInput').value.trim();
            const price = Number(document.getElementById('merchPriceInput').value);
            const qty = Number(document.getElementById('merchQtyInput').value);
            const channel = document.getElementById('merchChannelInput').value.trim();
            const note = document.getElementById('merchNoteInput').value.trim();

            const imgFile = document.getElementById('merchImgFile').files[0];
            let imgBase64 = null;
            if (imgFile) imgBase64 = await fileToBase64(imgFile, 500);

            oshi.merches.push({
                id: 'merch_' + Date.now(),
                eventName,
                name,
                price,
                qty,
                channel,
                note,
                imgBase64
            });

            saveToLocalStorage();
            closeMerchModal();
            renderMerchView();
        }

        function deleteMerch(merchId) {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            if (confirm('確定要刪除此筆周邊紀錄嗎？')) {
                oshi.merches = (oshi.merches || []).filter(m => m.id !== merchId);
                saveToLocalStorage();
                renderMerchView();
            }
        }
    </script>
</body>
</html>
