<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主推介紹 - OSHI Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            themeDark: '#121212',
            themeCard: '#1e1e1e'
          }
        }
      }
    }
  </script>
  <style>
    /* 自訂毛玻璃與滾動條樣式 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .glass-card {
      background: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-themeDark text-gray-100 font-sans min-h-screen pb-12">

  <!-- 頂部導覽與控制區 -->
  <header class="sticky top-0 z-40 bg-themeDark/80 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-heart text-red-500 text-xl"></i>
      <span class="font-bold text-lg tracking-wide text-white">OSHI Profile</span>
    </div>
    <button onclick="openEditModal()" class="text-xs bg-red-600 hover:bg-red-500 text-white font-semibold px-3 py-1.5 rounded-xl transition shadow-lg shadow-red-900/40 flex items-center gap-1.5">
      <i class="fa-solid fa-pen-to-square"></i>編輯主推資訊
    </button>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4 space-y-6">

    <!-- 1. 頂部 Banner 與 主推形象卡片區 -->
    <section class="relative rounded-3xl overflow-hidden bg-gray-900 border border-gray-800 shadow-2xl">
      <!-- 頂部 Banner 照片 -->
      <div id="oshiBanner" class="h-48 sm:h-64 md:h-80 w-full bg-cover bg-center relative transition-all duration-300">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/30 to-transparent"></div>
      </div>
      
      <!-- 主推個人形象資訊區 -->
      <div class="relative px-6 pb-6 pt-2 -mt-16 sm:-mt-20 flex flex-col sm:flex-row items-center sm:items-end gap-5 text-center sm:text-left">
        <!-- 大頭貼 -->
        <img id="oshiAvatar" src="" alt="Avatar" class="w-28 h-28 sm:w-36 sm:h-36 rounded-full border-4 border-gray-900 object-cover shadow-2xl bg-gray-800">
        
        <div class="flex-1 space-y-2">
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
            <h1 id="oshiName" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">請點擊右上角設定主推</h1>
            <!-- 追推天數標籤 -->
            <span id="oshiDaysBadge" class="inline-flex items-center justify-center px-3 py-1 rounded-full text-xs font-semibold bg-red-950/80 text-red-400 border border-red-800/50 self-center sm:self-auto">
              <i class="fa-solid fa-heart mr-1.5 text-red-500"></i><span id="oshiDaysText">追推 0 天</span>
            </span>
          </div>
          
          <!-- 生日與出道日資訊 -->
          <div class="flex flex-wrap items-center justify-center sm:justify-start gap-4 text-xs sm:text-sm text-gray-400">
            <span><i class="fa-solid fa-cake-candles text-red-400 mr-1.5"></i>生日：<span id="oshiBirthday" class="text-gray-200">未設定</span></span>
            <span><i class="fa-solid fa-star text-amber-400 mr-1.5"></i>出道日：<span id="oshiDebute" class="text-gray-200">未設定</span></span>
          </div>

          <p id="oshiBio" class="text-xs sm:text-sm text-gray-400 max-w-xl line-clamp-2 pt-1">目前尚未設定主推的詳細簡介，請點擊上方按鈕進行設定。</p>
        </div>
      </div>
    </section>

    <!-- 2. 社群連結按鈕區 -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <!-- YouTube 連結 -->
      <a id="linkYT" href="#" target="_blank" class="glass-card hover:bg-red-600/20 border border-gray-800 hover:border-red-500/50 rounded-2xl p-4 flex items-center gap-3 transition group">
        <div class="w-10 h-10 rounded-xl bg-red-600/20 text-red-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-youtube"></i>
        </div>
        <div class="overflow-hidden">
          <div class="text-xs text-gray-400">YouTube 頻道</div>
          <div class="text-sm font-bold text-gray-200 truncate group-hover:text-red-400">前往頻道</div>
        </div>
      </a>

      <!-- Twitch 連結 -->
      <a id="linkTwitch" href="#" target="_blank" class="glass-card hover:bg-purple-600/20 border border-gray-800 hover:border-purple-500/50 rounded-2xl p-4 flex items-center gap-3 transition group">
        <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-twitch"></i>
        </div>
        <div class="overflow-hidden">
          <div class="text-xs text-gray-400">Twitch 實況</div>
          <div class="text-sm font-bold text-gray-200 truncate group-hover:text-purple-400">前往實況台</div>
        </div>
      </a>

      <!-- X (Twitter) 連結 -->
      <a id="linkX" href="#" target="_blank" class="glass-card hover:bg-gray-700/30 border border-gray-800 hover:border-gray-500/50 rounded-2xl p-4 flex items-center gap-3 transition group">
        <div class="w-10 h-10 rounded-xl bg-gray-800 text-gray-200 flex items-center justify-center text-lg group-hover:scale-110 transition-transform">
          <i class="fa-brands fa-x-twitter"></i>
        </div>
        <div class="overflow-hidden">
          <div class="text-xs text-gray-400">X (Twitter)</div>
          <div class="text-sm font-bold text-gray-200 truncate group-hover:text-white">追蹤社群</div>
        </div>
      </a>
    </section>

    <!-- 3. 直播預告與周表區 -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 近期直播預告卡片 -->
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-satellite-dish text-red-500"></i>最新直播預告
          </h2>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-red-950 text-red-400 border border-red-800/50 font-medium">UPCOMING</span>
        </div>

        <div class="space-y-3">
          <div class="aspect-video bg-gray-800 rounded-2xl overflow-hidden relative group">
            <img id="streamCover" src="" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <a id="streamLink" href="#" target="_blank" class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-play"></i>前往觀看
              </a>
            </div>
          </div>
          <div>
            <h3 id="streamTitle" class="font-bold text-sm text-gray-100 line-clamp-1">未設定直播標題</h3>
            <p id="streamTime" class="text-xs text-gray-400 mt-1"><i class="fa-regular fa-clock mr-1"></i>開播時間：尚未預定</p>
          </div>
        </div>
      </div>

      <!-- 本周行程周表卡片 -->
      <div class="bg-gray-900 border border-gray-800 rounded-3xl p-5 space-y-4 shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-red-500"></i>本周行程 (周表)
          </h2>
          <span class="text-xs text-gray-400">WEEKLY SCHEDULE</span>
        </div>

        <div class="aspect-video bg-gray-800 rounded-2xl overflow-hidden relative border border-gray-800">
          <img id="scheduleImg" src="" class="w-full h-full object-cover">
        </div>
      </div>
    </section>

  </main>

  <!-- 4. 編輯主推資訊 Modal 視窗 -->
  <div id="editModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3">
        <h3 class="text-lg font-bold text-white">編輯主推 VTuber 資訊</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="space-y-3 text-xs sm:text-sm">
        <div>
          <label class="block text-gray-400 mb-1">VTuber 名稱</label>
          <input type="text" id="inputName" placeholder="例如：幸Sachi" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-400 mb-1">生日 (MM/DD)</label>
            <input type="text" id="inputBirthday" placeholder="例如：05/10" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">出道/推推日期</label>
            <input type="date" id="inputDebute" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          </div>
        </div>

        <div>
          <label class="block text-gray-400 mb-1">頭像圖片網址 (URL)</label>
          <input type="text" id="inputAvatar" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
        </div>

        <div>
          <label class="block text-gray-400 mb-1">Banner 封面網址 (URL)</label>
          <input type="text" id="inputBanner" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
        </div>

        <div>
          <label class="block text-gray-400 mb-1">簡介說明</label>
          <textarea id="inputBio" rows="2" placeholder="輸入主推的文字介紹..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500"></textarea>
        </div>

        <hr class="border-gray-800 my-2">

        <!-- 社群網址編輯 -->
        <div class="space-y-2">
          <label class="block text-gray-400">社群平台連結</label>
          <input type="text" id="inputYT" placeholder="YouTube 頻道連結" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputTwitch" placeholder="Twitch 頻道連結" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputX" placeholder="X (Twitter) 連結" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
        </div>

        <hr class="border-gray-800 my-2">

        <!-- 直播與周表編輯 -->
        <div class="space-y-2">
          <label class="block text-gray-400">直播與周表資訊</label>
          <input type="text" id="inputStreamTitle" placeholder="直播標題" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputStreamTime" placeholder="預定時間 (如：10/05 20:00)" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputStreamCover" placeholder="直播封面圖 URL" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputStreamLink" placeholder="直播觀看連結 URL" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
          <input type="text" id="inputScheduleImg" placeholder="周表圖片 URL" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-red-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-xs font-semibold">取消</button>
        <button onclick="saveOshiProfile()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-red-900/40">儲存更新</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 狀態管理邏輯 -->
  <script>
    // 預設主推檔案資料結構
    const defaultOshi = {
      name: '幸Sachi',
      birthday: '05/10',
      debuteDate: '2025-10-03',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop',
      banner: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200&auto=format&fit=crop',
      bio: '子午計畫三期生 / 歌唱與遊戲實況主',
      yt: 'https://youtube.com',
      twitch: 'https://twitch.tv',
      x: 'https://x.com',
      streamTitle: '【下班小確幸】聊聊連續兩周被炸紅色炸彈這件事',
      streamTime: '2026/10/05 20:00',
      streamCover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop',
      streamLink: 'https://youtube.com',
      scheduleImg: 'https://images.unsplash.com/photo-1506784983877-45594efa4cbe?q=80&w=600&auto=format&fit=crop'
    };

    let oshiData = defaultOshi;

    // 載入 LocalStorage
    function loadData() {
      const saved = localStorage.getItem('oshi_single_profile');
      if (saved) {
        try {
          oshiData = JSON.parse(saved);
        } catch (e) {
          console.error("Parse failed", e);
        }
      }
      render();
    }

    // 計算追推天數
    function getDaysCount(startDateStr) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const today = new Date();
      const diff = today - start;
      return Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
    }

    // 渲染 UI 畫面
    function render() {
      document.getElementById('oshiName').innerText = oshiData.name || '請設定名稱';
      document.getElementById('oshiBirthday').innerText = oshiData.birthday || '未設定';
      document.getElementById('oshiDebute').innerText = oshiData.debuteDate || '未設定';
      document.getElementById('oshiBio').innerText = oshiData.bio || '無簡介';

      // 頭像與 Banner
      document.getElementById('oshiAvatar').src = oshiData.avatar || '';
      document.getElementById('oshiBanner').style.backgroundImage = `url('${oshiData.banner || ''}')`;

      // 天數計算
      const days = getDaysCount(oshiData.debuteDate);
      document.getElementById('oshiDaysText').innerText = `追推 ${days} 天`;

      // 社群連結
      document.getElementById('linkYT').href = oshiData.yt || '#';
      document.getElementById('linkTwitch').href = oshiData.twitch || '#';
      document.getElementById('linkX').href = oshiData.x || '#';

      // 直播與周表
      document.getElementById('streamTitle').innerText = oshiData.streamTitle || '未預定直播';
      document.getElementById('streamTime').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>開播時間：${oshiData.streamTime || '未定'}`;
      document.getElementById('streamCover').src = oshiData.streamCover || '';
      document.getElementById('streamLink').href = oshiData.streamLink || '#';
      document.getElementById('scheduleImg').src = oshiData.scheduleImg || '';
    }

    // Modal 控制器
    function openEditModal() {
      document.getElementById('inputName').value = oshiData.name || '';
      document.getElementById('inputBirthday').value = oshiData.birthday || '';
      document.getElementById('inputDebute').value = oshiData.debuteDate || '';
      document.getElementById('inputAvatar').value = oshiData.avatar || '';
      document.getElementById('inputBanner').value = oshiData.banner || '';
      document.getElementById('inputBio').value = oshiData.bio || '';

      document.getElementById('inputYT').value = oshiData.yt || '';
      document.getElementById('inputTwitch').value = oshiData.twitch || '';
      document.getElementById('inputX').value = oshiData.x || '';

      document.getElementById('inputStreamTitle').value = oshiData.streamTitle || '';
      document.getElementById('inputStreamTime').value = oshiData.streamTime || '';
      document.getElementById('inputStreamCover').value = oshiData.streamCover || '';
      document.getElementById('inputStreamLink').value = oshiData.streamLink || '';
      document.getElementById('inputScheduleImg').value = oshiData.scheduleImg || '';

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    // 儲存資料
    function saveOshiProfile() {
      oshiData = {
        name: document.getElementById('inputName').value.trim(),
        birthday: document.getElementById('inputBirthday').value.trim(),
        debuteDate: document.getElementById('inputDebute').value,
        avatar: document.getElementById('inputAvatar').value.trim(),
        banner: document.getElementById('inputBanner').value.trim(),
        bio: document.getElementById('inputBio').value.trim(),
        yt: document.getElementById('inputYT').value.trim(),
        twitch: document.getElementById('inputTwitch').value.trim(),
        x: document.getElementById('inputX').value.trim(),
        streamTitle: document.getElementById('inputStreamTitle').value.trim(),
        streamTime: document.getElementById('inputStreamTime').value.trim(),
        streamCover: document.getElementById('inputStreamCover').value.trim(),
        streamLink: document.getElementById('inputStreamLink').value.trim(),
        scheduleImg: document.getElementById('inputScheduleImg').value.trim()
      };

      localStorage.setItem('oshi_single_profile', JSON.stringify(oshiData));
      closeModal();
      render();
    }

    // 初始化載入
    window.onload = loadData;
  </script>
</body>
</html>
