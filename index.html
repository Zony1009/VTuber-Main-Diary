<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>OshiVerse｜推活管理所</title>
<style>
:root{--bg:#080b16;--panel:#101528;--panel2:#151b31;--line:#252d49;--text:#f3f4ff;--muted:#9ba4c3;--pink:#ff5da8;--purple:#9b7bff;--cyan:#67e8f9;--green:#70e1b2;--danger:#ff718b;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#39205d66,transparent 35%),radial-gradient(ellipse at 0 30%,#142d5266,transparent 30%),var(--bg);color:var(--text);font:15px/1.55 Inter,"Noto Sans TC",system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}.app{max-width:1440px;margin:auto;padding:22px 26px 48px}.topbar{display:flex;align-items:center;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:20px;letter-spacing:.3px;white-space:nowrap}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;box-shadow:0 7px 25px #bd5bba55;font-size:21px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;font-weight:700}.account{margin-left:auto;display:flex;align-items:center;gap:9px;background:#12182b;border:1px solid var(--line);padding:7px 10px;border-radius:13px}.account input{background:transparent;border:0;color:var(--text);width:115px;outline:0}.account button,.icon-btn{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:8px}.account button:hover,.icon-btn:hover{background:#252d49;color:white}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px}.sidebar{background:#0e1324d9;border:1px solid var(--line);border-radius:22px;padding:17px;height:max-content;position:sticky;top:15px}.side-title{font-size:11px;color:var(--muted);letter-spacing:1.7px;font-weight:800;margin:5px 8px 12px}.oshi-list{display:grid;gap:7px}.oshi{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid transparent;background:transparent;border-radius:13px;text-align:left;width:100%;transition:.2s}.oshi:hover{background:#171d34}.oshi.active{background:linear-gradient(100deg,#ff5da81c,#9b7bff20);border-color:#9b7bff66}.avatar{width:39px;height:39px;border-radius:13px;object-fit:cover;background:linear-gradient(135deg,#5d437f,#d65b9a);display:grid;place-items:center;font-weight:900;flex:none}.oshi .meta{min-width:0;flex:1}.oshi strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.oshi small{display:block;color:var(--muted);font-size:11px}.add-oshi{width:100%;margin-top:12px;border:1px dashed #4b5275;background:#151a2d;color:#c9c9e9;border-radius:12px;padding:10px}.side-foot{margin-top:20px;padding:12px;background:#151a2d;border-radius:13px;color:var(--muted);font-size:11px}.main{min-width:0}.tabs{display:flex;gap:7px;padding:6px;background:#0e1324;border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%;margin-bottom:18px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px}.tab.active{background:linear-gradient(110deg,#ff5da8,#9b7bff);color:white;box-shadow:0 5px 18px #a14f9a44}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 17px}.eyebrow{color:var(--pink);font-size:11px;letter-spacing:2px;font-weight:900}.page-head h1{font-size:25px;margin:2px 0 0;letter-spacing:-.5px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:#171d33;border-radius:11px;padding:9px 13px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#8e78d9;background:#202744}.btn.primary{border:0;background:linear-gradient(110deg,var(--pink),var(--purple));box-shadow:0 7px 20px #a64b9840}.btn.danger{color:#ff9bac;border-color:#77364c;background:#291725}.banner{height:235px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(115deg,#382044,#172447 60%,#202c4e);border:1px solid #ffffff12;box-shadow:var(--shadow);margin-bottom:17px}.banner img.cover{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:.62}.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080b16e8 0%,#080b1688 54%,transparent 100%),linear-gradient(0deg,#080b1688,transparent 60%)}.banner-content{position:absolute;z-index:1;inset:0;display:flex;align-items:end;padding:24px 27px;gap:17px}.hero-avatar{width:88px;height:88px;border-radius:24px;object-fit:cover;border:3px solid #ffffffaa;box-shadow:0 9px 28px #0007;background:linear-gradient(135deg,var(--pink),var(--purple))}.hero-info{min-width:0}.hero-info h2{font-size:28px;margin:0 0 3px}.hero-info p{margin:0;color:#d1d5ec;font-size:12px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{padding:4px 9px;border:1px solid #ffffff24;background:#ffffff12;border-radius:99px;font-size:10px;color:#f1eaff}.hero-actions{margin-left:auto;align-self:flex-start;display:flex;gap:7px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}.stat,.card{background:linear-gradient(145deg,#12182b,#0f1425);border:1px solid var(--line);border-radius:17px;padding:17px}.stat{display:flex;align-items:center;gap:13px}.stat-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#a276ff1b;font-size:18px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px;letter-spacing:-.5px}.content-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.card h3{font-size:14px;margin:0 0 12px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.card-head h3{margin:0}.bio{color:#c3c9df;white-space:pre-wrap;font-size:13px;min-height:55px}.tag{display:inline-flex;border-radius:8px;padding:4px 8px;margin:0 5px 6px 0;background:#9b7bff18;border:1px solid #9b7bff38;color:#c9b9ff;font-size:11px}.socials{display:flex;flex-wrap:wrap;gap:8px}.social{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#151b30;padding:8px 10px;border-radius:10px;font-size:11px}.social:hover{border-color:var(--pink)}.embed{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#080b16}.empty{padding:28px;text-align:center;border:1px dashed #333c5d;border-radius:14px;color:var(--muted);font-size:12px}.empty b{display:block;color:#e5e7f7;font-size:14px;margin-bottom:5px}.calendar-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(230px,.6fr);gap:14px}.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cal-top strong{font-size:17px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:5px 0}.day{min-height:82px;border:1px solid #242c46;background:#101629;border-radius:10px;padding:7px 5px;text-align:left;min-width:0;overflow:hidden}.day:hover{border-color:#9b7bff}.day.other{opacity:.3}.day.today{border-color:var(--pink);box-shadow:inset 0 0 0 1px #ff5da844}.day.selected{background:#312044;border-color:var(--purple)}.day-num{font-size:11px;font-weight:800}.event-dot{display:block;font-size:9px;padding:3px 4px;border-radius:5px;margin-top:4px;background:#9b7bff24;color:#d9c9ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-dot.直播預告{background:#ff5da820;color:#ff9fc9}.event-dot.會員限定{background:#67e8f920;color:#8eeefa}.event-dot.紀念日{background:#70e1b220;color:#9af1cb}.event-dot.桌布發布{background:#ffca7020;color:#ffdc98}.event-list{display:grid;gap:8px}.event-row,.merch-row{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #242c46;background:#11172a;border-radius:11px}.event-date{min-width:43px;text-align:center;border-right:1px solid var(--line);padding-right:9px}.event-date b{display:block;font-size:16px}.event-date small{font-size:9px;color:var(--muted)}.event-detail{min-width:0;flex:1}.event-detail b{display:block;font-size:11px}.event-detail small{color:var(--muted);font-size:10px}.merch-summary{display:flex;align-items:center;justify-content:space-between;gap:15px;background:linear-gradient(110deg,#48233e,#28234f);border:1px solid #b35bbd55;padding:19px 22px;border-radius:17px;margin-bottom:15px}.merch-summary small{color:#e6cce9}.merch-summary strong{font-size:27px;display:block}.group-title{font-size:13px;font-weight:800;margin:18px 0 9px;display:flex;justify-content:space-between}.merch-row{align-items:flex-start;margin-bottom:7px}.merch-img{width:61px;height:61px;border-radius:10px;object-fit:cover;background:#252b44;flex:none}.merch-info{flex:1;min-width:0}.merch-info b{font-size:12px;display:block}.merch-info small{display:block;color:var(--muted);font-size:10px}.merch-price{text-align:right;white-space:nowrap}.merch-price b{font-size:12px;display:block}.merch-price small{font-size:10px;color:var(--muted)}.overlay{position:fixed;inset:0;background:#03050bc9;backdrop-filter:blur(8px);z-index:10;display:grid;place-items:center;padding:15px}.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:#11172a;border:1px solid #343d60;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal h2{font-size:18px;margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.4px}.field input,.field textarea,.field select{width:100%;border:1px solid #303956;background:#0b1020;color:var(--text);border-radius:10px;padding:10px 11px;outline:0;font-size:12px}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple)}.field textarea{min-height:85px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.modal-actions .right{display:flex;gap:8px}.preview{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#272d46}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#232b43;border:1px solid #58648a;padding:10px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow);font-size:12px}.hidden{display:none!important}.file-line{display:flex;align-items:center;gap:10px}.file-line input{max-width:220px}.footer{text-align:center;color:#626b89;font-size:10px;margin-top:20px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;padding:12px}.oshi-list{display:flex;overflow:auto}.oshi{min-width:145px;width:auto}.side-title{margin-bottom:7px}.add-oshi{width:auto;margin-top:9px}.side-foot{display:none}.content-grid,.calendar-wrap{grid-template-columns:1fr}.app{padding:14px}.banner{height:215px}}
@media(max-width:560px){.brand{font-size:16px}.brand small{font-size:8px}.logo{width:36px;height:36px}.account input{width:75px}.topbar{gap:9px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.stat{padding:12px}.stat strong{font-size:17px}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{padding:9px 3px;font-size:11px}.page-head h1{font-size:21px}.banner{height:195px}.banner-content{padding:15px;gap:10px}.hero-avatar{width:65px;height:65px;border-radius:18px}.hero-info h2{font-size:20px}.hero-info p{font-size:10px}.hero-actions{gap:1px}.hero-actions .btn{padding:7px;font-size:10px}.day{min-height:62px;padding:5px 3px}.event-dot{font-size:8px;padding:2px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.merch-summary strong{font-size:22px}}
</style>
</head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo">✦</div><div>OshiVerse<small>YOUR PERSONAL OSHI SPACE</small></div></div><div class="account"><span>👤</span><input id="accountName" aria-label="使用者暱稱" maxlength="24" placeholder="使用者暱稱"><button id="switchAccount" title="切換／建立帳號">↵</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-title">MY OSHI COLLECTION ✦</div><div id="oshiList" class="oshi-list"></div><button class="add-oshi" id="addOshi">＋ 新增主推</button><div class="side-foot">✧ 每一份喜愛，都值得被好好收藏。<br><br>資料只儲存在目前瀏覽器中。建議定期匯出備份。</div></aside>
<main class="main"><nav class="tabs"><button class="tab active" data-tab="home">✧ 推活主頁</button><button class="tab" data-tab="calendar">▦ 活動行事曆</button><button class="tab" data-tab="merch">♡ 周邊收藏</button></nav><div id="view"></div></main></div><div class="footer">OSHIVERSE · MADE WITH ♡ FOR YOUR OSHI · 資料儲存於本機瀏覽器</div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({users:{},currentUser:'Guest'});let db;try{db=JSON.parse(localStorage.getItem('oshiverse_v1'))||defaults()}catch{db=defaults()}if(!db.users)db=defaults();let user=db.currentUser||'Guest',tab='home',active=null,calDate=new Date(),selectedDate=today(),modalOshi=null;
function save(){db.currentUser=user;localStorage.setItem('oshiverse_v1',JSON.stringify(db))}
function freshOshi(){return{id:uid(),name:'新主推',birthday:'',debut:'',avatar:'',cover:'',tags:[],socials:[],bio:'',stream:'',events:[],merch:[]}}
function data(){if(!db.users[user])db.users[user]={oshis:[],active:null};return db.users[user]}
function current(){return data().oshis.find(x=>x.id===data().active)||null}
function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:2})}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2300)}
function imageFile(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)}
function initials(s){return esc((s||'?').trim().slice(0,2))}
function avatarHTML(o,cls='avatar'){return o.avatar?`<img class="${cls}" src="${o.avatar}" alt="">`:`<div class="${cls}">${initials(o.name)}</div>`}
function renderSide(){$('#accountName').value=user;let list=data().oshis;$('#oshiList').innerHTML=list.map(o=>`<button class="oshi ${o.id===data().active?'active':''}" data-oshi="${o.id}">${avatarHTML(o)}<span class="meta"><strong>${esc(o.name)}</strong><small>${o.birthday?'🎂 '+o.birthday:'尚未設定生日'}</small></span>${o.id===data().active?'<span style="color:var(--pink)">✦</span>':''}</button>`).join('')||'<div class="empty" style="padding:15px">還沒有主推<br>新增一位開始收藏吧！</div>';$$('[data-oshi]').forEach(b=>b.onclick=()=>{data().active=b.dataset.oshi;save();render()})}
function render(){renderSide();$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let o=current();if(!o){$('#view').innerHTML=`<div class="empty" style="padding:65px 20px"><div style="font-size:40px;margin-bottom:10px">✧</div><b>建立你的專屬推活宇宙</b>新增第一位主推，開始紀錄每一份喜愛與回憶。<br><br><button class="btn primary" id="emptyAdd">＋ 新增我的主推</button></div>`;$('#emptyAdd').onclick=()=>openOshi();return}$('#view').innerHTML=tab==='home'?home(o):tab==='calendar'?calendar(o):merch(o);wireView(o)}
function home(o){let video=videoId(o.stream);let days=o.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return `<section class="banner">${o.cover?`<img class="cover" src="${o.cover}">`:''}<div class="banner-content">${avatarHTML(o,'hero-avatar')}<div class="hero-info"><div class="eyebrow">MY FAVORITE CREATOR</div><h2>${esc(o.name)}</h2><p>把每個閃耀瞬間，都收進專屬收藏。</p><div class="pills">${o.birthday?`<span class="pill">🎂 ${esc(o.birthday)}</span>`:''}${o.debut?`<span class="pill">✦ 出道 ${esc(o.debut)}</span>`:''}${o.tags.slice(0,4).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></div><div class="hero-actions"><button class="btn" id="editOshi">✎ 編輯</button><button class="btn" id="exportBtn" title="匯出備份">⇩</button></div></div></section>
<div class="stats"><div class="stat"><div class="stat-icon">♡</div><div><small>周邊收藏件數</small><strong>${o.merch.reduce((s,m)=>s+Number(m.qty||0),0)}</strong></div></div><div class="stat"><div class="stat-icon">▦</div><div><small>已記錄行程</small><strong>${o.events.length}</strong></div></div><div class="stat"><div class="stat-icon">✧</div><div><small>周邊累積花費</small><strong>${money(o.merch.reduce((s,m)=>s+Number(m.price||0)*Number(m.qty||0),0))}</strong></div></div></div>
<div class="content-grid"><section class="card"><div class="card-head"><h3>✦ 關於這位主推</h3><button class="icon-btn" id="editBio">✎</button></div><div class="bio">${o.bio?esc(o.bio):'<span class="muted">寫下你的主推介紹、入坑契機或應援心得…</span>'}</div><div style="margin-top:13px">${o.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></section><section class="card"><div class="card-head"><h3>⌁ 頻道與社群</h3><button class="icon-btn" id="editSocial">＋</button></div><div class="socials">${o.socials.map(s=>`<a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">↗ ${esc(s.platform)}</a>`).join('')||'<span class="muted" style="font-size:11px">新增社群連結，快速前往頻道。</span>'}</div></section><section class="card" style="grid-column:1/-1"><div class="card-head"><h3>▶ 直播與預告</h3><button class="icon-btn" id="editStream">✎ 設定網址</button></div>${video?`<iframe class="embed" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(video)}" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="muted" style="font-size:10px;margin-top:7px">● 已載入預告／直播播放器</div>`:`<div class="empty">尚未設定直播或預告影片<br><small>貼上 YouTube 影片、直播或 Shorts 網址即可嵌入。</small></div>`}</section><section class="card" style="grid-column:1/-1"><div class="card-head"><h3>◷ 即將到來的行程</h3><button class="btn" id="goCalendar">查看行事曆 →</button></div>${days.length?days.map(e=>`<div class="event-row" style="margin-bottom:7px"><div class="event-date"><b>${e.date.slice(8)}</b><small>${e.date.slice(5,7)} 月</small></div><div class="event-detail"><b>${esc(e.title)}</b><small>${esc(e.type)}${e.time?' · '+esc(e.time):''}</small></div></div>`).join(''):'<div class="empty">還沒有即將到來的行程。</div>'}</section></div>`}
function videoId(url){if(!url)return'';try{let u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.match(/\/(embed|live|shorts)\/([^/?]+)/)?.[2]||''}catch{}return''}
function calendar(o){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,monthEvents=o.events.filter(e=>e.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')),chosen=o.events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return `<div class="page-head"><div><div class="eyebrow">PLAN YOUR OSHI DAYS</div><h1>活動行事曆</h1></div><button class="btn primary" id="addEvent">＋ 新增行程</button></div><div class="calendar-wrap"><section class="card"><div class="cal-top"><div style="display:flex;gap:7px"><button class="btn" id="prevMonth">‹</button><button class="btn" id="todayMonth">今天</button><button class="btn" id="nextMonth">›</button></div><strong>${y} 年 ${m+1} 月</strong></div><div class="cal-grid">${['日','一','二','三','四','五','六'].map(w=>`<div class="weekday">${w}</div>`).join('')}${days.map(d=>{let k=key(d),ev=o.events.filter(e=>e.date===k);return `<button class="day ${d.getMonth()!==m?'other':''} ${k===today()?'today':''} ${k===selectedDate?'selected':''}" data-date="${k}"><span class="day-num">${d.getDate()}</span>${ev.slice(0,2).map(e=>`<span class="event-dot ${esc(e.type)}">${esc(e.title)}</span>`).join('')}${ev.length>2?`<span class="muted" style="font-size:8px">+${ev.length-2}</span>`:''}</button>`}).join('')}</div></section><section class="card"><div class="card-head"><h3>▦ ${selectedDate===today()?'今日行程':esc(selectedDate)}</h3><button class="icon-btn" id="addSelected">＋</button></div>${chosen.length?`<div class="event-list">${chosen.map(e=>`<div class="event-row"><div class="event-detail"><span class="tag">${esc(e.type)}</span><b>${esc(e.title)}</b><small>${esc(e.time||'時間未定')} ${e.note?'· '+esc(e.note):''}</small></div><button class="icon-btn" data-edit-event="${e.id}">✎</button><button class="icon-btn" data-del-event="${e.id}">×</button></div>`).join('')}</div>`:'<div class="empty">這天還沒有排程<br>點擊＋新增一筆行程。</div>'}</section></div><section class="card" style="margin-top:14px"><div class="card-head"><h3>本月排程清單</h3><span class="muted" style="font-size:10px">${monthEvents.length} 個事件</span></div>${monthEvents.length?`<div class="event-list">${monthEvents.map(e=>`<div class="event-row"><div class="event-date"><b>${e.date.slice(8)}</b><small>${e.date.slice(5,7)} 月</small></div><div class="event-detail"><b>${esc(e.title)}</b><small>${esc(e.type)}${e.time?' · '+esc(e.time):''}</small></div><button class="icon-btn" data-edit-event="${e.id}">✎</button></div>`).join('')}</div>`:'<div class="empty">本月尚無行程紀錄。</div>'}</section>`}
function merch(o){let total=o.merch.reduce((s,m)=>s+Number(m.price||0)*Number(m.qty||0),0),groups={};o.merch.forEach(m=>(groups[m.group||'未分類主題']??=[]).push(m));return `<div class="page-head"><div><div class="eyebrow">COLLECT MEMORIES</div><h1>周邊戰利品</h1></div><button class="btn primary" id="addMerch">＋ 新增周邊</button></div><div class="merch-summary"><div><small>✧ 累積應援花費</small><strong>${money(total)}</strong><small>共收藏 ${o.merch.reduce((s,m)=>s+Number(m.qty||0),0)} 件商品</small></div><div style="font-size:35px">♡</div></div>${Object.keys(groups).length?Object.entries(groups).map(([g,items])=>`<section><div class="group-title"><span>✦ ${esc(g)}</span><span class="muted">${money(items.reduce((s,m)=>s+Number(m.price||0)*Number(m.qty||0),0))}</span></div>${items.map(m=>`<div class="merch-row">${m.image?`<img class="merch-img" src="${m.image}">`:`<div class="merch-img" style="display:grid;place-items:center;font-size:22px">♡</div>`}<div class="merch-info"><b>${esc(m.name)}</b><small>${esc(m.channel||'購買管道未記錄')} · 數量 ${m.qty}</small>${m.note?`<small>${esc(m.note)}</small>`:''}</div><div class="merch-price"><b>${money(m.price*m.qty)}</b><small>${money(m.price)} × ${m.qty}</small></div><button class="icon-btn" data-edit-merch="${m.id}">✎</button><button class="icon-btn" data-del-merch="${m.id}">×</button></div>`).join('')}</section>`).join(''):'<div class="empty" style="padding:50px"><div style="font-size:34px">♡</div><b>收藏故事，從第一件周邊開始</b>記錄購買主題、數量與花費，建立專屬戰利品清單。</div>'}`}
function modal(title,body,submit,remove){$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><form class="modal" id="modalForm"><h2>${title}</h2>${body}<div class="modal-actions">${remove||'<span></span>'}<div class="right"><button type="button" class="btn" id="cancelModal">取消</button><button class="btn primary" type="submit">儲存</button></div></div></form></div>`;$('#cancelModal').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};$('#modalForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.currentTarget))}}
function closeModal(){$('#modalRoot').innerHTML=''}
function fileField(label,id,old){return `<div class="field"><label>${label}</label><div class="file-line">${old?`<img class="preview" src="${old}" id="${id}Preview">`:`<div class="preview" id="${id}Preview" style="display:grid;place-items:center">✧</div>`}<input type="file" id="${id}" accept="image/*"></div><small class="muted">圖片會自動縮放壓縮後儲存。</small></div>`}
function openOshi(id){let o=id?data().oshis.find(x=>x.id===id):freshOshi();modalOshi=o;let tags=o.tags.join(', '),socials=o.socials.map(s=>`${s.platform}|${s.url}`).join('\n');modal(`${id?'編輯主推檔案':'新增主推'}`,`<div class="form-grid"><div class="field full"><label>VTuber 名字 *</label><input name="name" required maxlength="60" value="${esc(o.name)}" placeholder="輸入名字"></div><div class="field"><label>生日 (MM-DD)</label><input name="birthday" placeholder="01-23" pattern="\\d{2}-\\d{2}" value="${esc(o.birthday)}"></div><div class="field"><label>出道日期</label><input name="debut" type="date" value="${esc(o.debut)}"></div>${fileField('頭像圖片','avatarFile',o.avatar)}${fileField('封面圖片','coverFile',o.cover)}<div class="field full"><label>特色標籤（以逗號分隔）</label><input name="tags" value="${esc(tags)}" placeholder="#歌勢, #遊戲勢"></div><div class="field full"><label>社群連結（每行一組：平台|網址）</label><textarea name="socials" placeholder="YouTube|https://youtube.com/@...&#10;X|https://x.com/...">${esc(socials)}</textarea></div><div class="field full"><label>個人簡介／應援心得</label><textarea name="bio">${esc(o.bio)}</textarea></div></div>`,async f=>{let name=f.get('name').trim();if(!name)return;let parse=()=>[...f.get('socials').split('\n')].map(x=>x.trim()).filter(Boolean).map(x=>{let a=x.split('|');return{platform:a[0].trim(),url:(a.slice(1).join('|')||'').trim()}}).filter(x=>x.platform&&/^https?:\\/\\//i.test(x.url));o.name=name;o.birthday=f.get('birthday').trim();o.debut=f.get('debut');o.tags=f.get('tags').split(/[,，]/).map(x=>x.trim()).filter(Boolean);o.socials=parse();o.bio=f.get('bio');let pending=2;for(let [id,key] of [['avatarFile','avatar'],['coverFile','cover']]){let file=$('#'+id).files[0];if(file)imageFile(file,v=>{o[key]=v;if(--pending===0)finish()});else pending--}function finish(){if(!id)data().oshis.push(o);data().active=o.id;save();closeModal();render();toast('主推檔案已儲存')}if(pending===0)finish()},id?`<button type="button" class="btn danger" id="deleteOshi">刪除此主推</button>`:null);for(let id of ['avatarFile','coverFile'])$('#'+id).onchange=e=>imageFile(e.target.files[0],v=>{$('#'+id+'Preview').outerHTML=`<img class="preview" id="${id}Preview" src="${v}">`});if(id)$('#deleteOshi').onclick=()=>{if(confirm(`確定刪除「${o.name}」及其行程、周邊紀錄？`)){data().oshis=data().oshis.filter(x=>x.id!==id);data().active=data().oshis[0]?.id||null;save();closeModal();render();toast('已刪除主推')}}}
function openEvent(date,id){let o=current(),e=id?o.events.find(x=>x.id===id):{id:uid(),date,title:'',time:'',type:'直播預告',note:''};modal(id?'編輯行程':'新增行程',`<div class="form-grid"><div class="field"><label>日期 *</label><input name="date" type="date" required value="${esc(e.date||date)}"></div><div class="field"><label>時間</label><input name="time" type="time" value="${esc(e.time)}"></div><div class="field full"><label>行程名稱 *</label><input name="title" required maxlength="100" value="${esc(e.title)}" placeholder="例如：生日紀念直播"></div><div class="field"><label>事件分類</label><select name="type">${['直播預告','會員限定','桌布發布','紀念日','其他'].map(t=>`<option ${e.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>備註</label><input name="note" value="${esc(e.note)}" placeholder="選填"></div></div>`,f=>{Object.assign(e,{date:f.get('date'),time:f.get('time'),title:f.get('title').trim(),type:f.get('type'),note:f.get('note').trim()});if(!id)o.events.push(e);selectedDate=e.date;calDate=new Date(e.date+'T12:00:00');save();closeModal();render();toast('行程已儲存')},id?`<button type="button" class="btn danger" id="deleteEvent">刪除行程</button>`:null);if(id)$('#deleteEvent').onclick=()=>{if(confirm('確定刪除這筆行程？')){o.events=o.events.filter(x=>x.id!==id);save();closeModal();render();toast('行程已刪除')}}}
function openMerch(id){let o=current(),m=id?o.merch.find(x=>x.id===id):{id:uid(),group:'',name:'',price:0,qty:1,channel:'',note:'',image:''};modal(id?'編輯周邊':'新增周邊',`<div class="form-grid"><div class="field full"><label>活動／主題名稱 *</label><input name="group" required value="${esc(m.group)}" placeholder="例如：2026 生日紀念周邊"></div><div class="field full"><label>商品名稱 *</label><input name="name" required value="${esc(m.name)}" placeholder="輸入商品名稱"></div><div class="field"><label>單價 (NT$) *</label><input name="price" type="number" min="0" step="0.01" required value="${Number(m.price)||0}"></div><div class="field"><label>購買數量 *</label><input name="qty" type="number" min="1" step="1" required value="${Number(m.qty)||1}"></div><div class="field"><label>購買管道</label><input name="channel" value="${esc(m.channel)}" placeholder="官方商城、展覽現場…"></div><div class="field"><label>備註</label><input name="note" value="${esc(m.note)}"></div>${fileField('商品照片','merchFile',m.image)}</div>`,f=>{Object.assign(m,{group:f.get('group').trim(),name:f.get('name').trim(),price:Number(f.get('price')),qty:Number(f.get('qty')),channel:f.get('channel').trim(),note:f.get('note').trim()});let file=$('#merchFile').files[0],finish=()=>{if(!id)o.merch.push(m);save();closeModal();render();toast('周邊紀錄已儲存')};if(file)imageFile(file,v=>{m.image=v;finish()});else finish()},id?`<button type="button" class="btn danger" id="deleteMerch">刪除周邊</button>`:null);$('#merchFile').onchange=e=>imageFile(e.target.files[0],v=>{$('#merchFilePreview').outerHTML=`<img class="preview" id="merchFilePreview" src="${v}">`});if(id)$('#deleteMerch').onclick=()=>{if(confirm('確定刪除這件周邊？')){o.merch=o.merch.filter(x=>x.id!==id);save();closeModal();render();toast('周邊已刪除')}}}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),user,data:data()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`oshiverse-${user.replace(/[^\w\u4e00-\u9fff-]/g,'_')}-backup.json`;a.click();URL.revokeObjectURL(a.href);toast('備份檔已匯出')}
function wireView(o){$('#editOshi')?.addEventListener('click',()=>openOshi(o.id));$('#editBio')?.addEventListener('click',()=>openOshi(o.id));$('#editSocial')?.addEventListener('click',()=>openOshi(o.id));$('#editStream')?.addEventListener('click',()=>modal('設定 YouTube 直播／預告',`<div class="field"><label>YouTube 網址</label><input name="url" type="url" value="${esc(o.stream)}" placeholder="https://www.youtube.com/watch?v=..."></div><p class="muted" style="font-size:11px">支援一般影片、直播、Shorts 與 youtu.be 連結。</p>`,f=>{let url=f.get('url').trim();if(url&&!videoId(url)){toast('無法辨識 YouTube 影片網址');return}o.stream=url;save();closeModal();render();toast('播放器設定已更新')}));$('#exportBtn')?.addEventListener('click',exportData);$('#goCalendar')?.addEventListener('click',()=>{tab='calendar';render()});$('#addEvent')?.addEventListener('click',()=>openEvent(selectedDate));$('#addSelected')?.addEventListener('click',()=>openEvent(selectedDate));$('#prevMonth')?.addEventListener('click',()=>{calDate.setMonth(calDate.getMonth()-1);selectedDate=`${calDate.getFullYear()}-${String(calDate.getMonth()+1).padStart(2,'0')}-01`;render()});$('#nextMonth')?.addEventListener('click',()=>{calDate.setMonth(calDate.getMonth()+1);selectedDate=`${calDate.getFullYear()}-${String(calDate.getMonth()+1).padStart(2,'0')}-01`;render()});$('#todayMonth')?.addEventListener('click',()=>{calDate=new Date();selectedDate=today();render()});$$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});$$('[data-edit-event]').forEach(b=>b.onclick=()=>openEvent(selectedDate,b.dataset.editEvent));$$('[data-del-event]').forEach(b=>b.onclick=()=>{let e=o.events.find(x=>x.id===b.dataset.delEvent);if(e&&confirm('確定刪除這筆行程？')){o.events=o.events.filter(x=>x.id!==e.id);save();render()}});$('#addMerch')?.addEventListener('click',()=>openMerch());$$('[data-edit-merch]').forEach(b=>b.onclick=()=>openMerch(b.dataset.editMerch));$$('[data-del-merch]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這件周邊？')){o.merch=o.merch.filter(x=>x.id!==b.dataset.delMerch);save();render()}})}
$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#addOshi').onclick=()=>openOshi();$('#switchAccount').onclick=()=>{let n=$('#accountName').value.trim();if(!n){toast('請輸入使用者暱稱');return}user=n;if(!db.users[user])db.users[user]={oshis:[],active:null};save();tab='home';render();if(!data().oshis.length)openOshi();else toast(`已切換至 ${user}`)};$('#accountName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#switchAccount').click()});
if(!data().oshis.length){data().active=null}else if(!data().oshis.some(o=>o.id===data().active))data().active=data().oshis[0].id;save();render();if(!data().oshis.length)openOshi();
})();
</script></body></html>
