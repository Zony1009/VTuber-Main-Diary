<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber 推活專屬管理 Suite</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased selection:bg-pink-500 selection:text-white">

    <!-- 頂部導覽列 Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <!-- App Logo -->
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-500 to-purple-600 flex items-center justify-center font-black text-xl shadow-lg shadow-pink-500/20">推</div>
                <span class="font-bold text-lg bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent hidden sm:inline">Oshi Suite</span>
            </div>

            <!-- 主推選擇器 Tab Bar -->
            <div id="oshiTabBar" class="flex items-center gap-2 overflow-x-auto py-2 no-scrollbar max-w-xl">
                <!-- 動態渲染主推分頁 -->
            </div>

            <!-- 右側功能選單 -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="openAddOshiModal()" class="flex items-center gap-1.5 text-xs bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all shadow-md shadow-pink-600/20">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden md:inline">新增主推</span>
                </button>
                <button onclick="openUserModal()" class="flex items-center gap-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-1.5 rounded-lg transition-all">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    <span id="currentUserLabel" class="max-w-[80px] truncate">使用者</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區塊 Main Layout -->
    <main id="appContainer" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        <!-- 頁籤導覽 (Home / Calendar / Merch) -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <nav class="flex space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="switchView('home')" id="tab-home" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="heart" class="w-4 h-4"></i> 推活主頁
                </button>
                <button onclick="switchView('calendar')" id="tab-calendar" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="calendar" class="w-4 h-4"></i> 活動行事曆
                </button>
                <button onclick="switchView('merch')" id="tab-merch" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i> 戰利品與花費
                </button>
            </nav>
            <div id="oshiEditBtnContainer"></div>
        </div>

        <!-- 視圖 1: 推活主頁 Home View -->
        <section id="view-home" class="space-y-6">
            <!-- 視覺 Banner 區塊 -->
            <div class="relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-xl">
                <div id="oshiCover" class="h-48 md:h-64 bg-gradient-to-r from-slate-900 via-purple-950 to-slate-900 bg-cover bg-center opacity-80"></div>
                <div class="p-6 relative flex flex-col md:flex-row gap-6 items-start md:items-end -mt-20 md:-mt-16 bg-gradient-to-t from-slate-900 via-slate-900/90 to-transparent">
                    <img id="oshiAvatar" src="" class="w-28 h-28 md:w-36 md:h-36 rounded-2xl border-4 border-slate-900 object-cover shadow-2xl bg-slate-800 shrink-0">
                    <div class="space-y-2 flex-1">
                        <div class="flex flex-wrap items-center gap-3">
                            <h1 id="oshiName" class="text-2xl md:text-4xl font-extrabold text-white">---</h1>
                            <div id="oshiBirthdayBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-pink-500/10 text-pink-400 border border-pink-500/20 flex items-center gap-1">
                                <i data-lucide="cake" class="w-3.5 h-3.5"></i> 生日: <span id="oshiBirthday">--/--</span>
                            </div>
                            <div id="oshiDebutBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center gap-1">
                                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 出道: <span id="oshiDebut">----/--/--</span>
                            </div>
                        </div>
                        <div id="oshiTags" class="flex flex-wrap gap-1.5 pt-1"></div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：個人簡介與社群連結 -->
                <div class="space-y-6 lg:col-span-1">
                    <!-- 社群連結快捷入口 -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="link" class="w-4 h-4 text-pink-400"></i> 社群與頻道
                        </h3>
                        <div id="oshiSocialLinks" class="grid grid-cols-1 gap-2"></div>
                    </div>

                    <!-- 應援心得 / 簡介 -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="book-open" class="w-4 h-4 text-purple-400"></i> 個人簡介與應援筆記
                        </h3>
                        <p id="oshiBio" class="text-sm text-slate-300 leading-relaxed whitespace-pre-line bg-slate-950/50 p-4 rounded-xl border border-slate-800/80">尚未填寫筆記...</p>
                    </div>
                </div>

                <!-- 右側：YouTube 直播與預告嵌入 -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                                <i data-lucide="tv" class="w-4 h-4 text-red-500"></i> 最新直播 / 預告嵌入
                            </h3>
                            <span id="streamStatusBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">未設定</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="streamUrlInput" placeholder="貼上 YouTube 影片/直播網址 (例如 https://www.youtube.com/watch?v=...)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                            <button onclick="saveStreamUrl()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition-all">更新</button>
                        </div>
                        <div id="streamEmbedContainer" class="aspect-video bg-slate-950 rounded-xl border border-slate-800 overflow-hidden flex items-center justify-center text-slate-500 text-sm">
                            <div class="text-center space-y-2">
                                <i data-lucide="youtube" class="w-12 h-12 mx-auto text-slate-700"></i>
                                <p>貼上 YouTube 網址即可即時嵌入播放器</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 視圖 2: 活動行事曆 Calendar View -->
        <section id="view-calendar" class="hidden space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
                <!-- 日曆控制器 -->
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <h2 id="calendarMonthLabel" class="text-xl font-bold text-white">2026 年 10 月</h2>
                        <button onclick="jumpToToday()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg">今天</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeMonth(-1)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <button onclick="changeMonth(1)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <!-- 日曆網格 Header -->
                <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 py-2 border-b border-slate-800">
                    <span class="text-red-400">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="text-blue-400">六</span>
                </div>

                <!-- 日曆網格 Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
            </div>

            <!-- 本月行程清單 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="list-todo" class="w-5 h-5 text-pink-400"></i> 本月活動行程清單
                </h3>
                <div id="monthlyEventsList" class="space-y-2"></div>
            </div>
        </section>

        <!-- 視圖 3: 周邊戰利品與花費 Merch View -->
        <section id="view-merch" class="hidden space-y-6">
            <!-- 總花費統計 Card -->
            <div class="bg-gradient-to-r from-slate-900 via-purple-950/40 to-slate-900 border border-purple-500/20 rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>
                    <span class="text-xs font-semibold uppercase text-purple-400 tracking-wider">Merch Expenditure</span>
                    <h2 class="text-xl font-bold text-slate-200">累積周邊戰利品總花費</h2>
                </div>
                <div class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">
                    NT$ <span id="totalMerchCost">0</span>
                </div>
            </div>

            <!-- 新增商品與紀錄按鈕 -->
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="package" class="w-5 h-5 text-purple-400"></i> 周邊收藏清單
                </h3>
                <button onclick="openAddMerchModal()" class="flex items-center gap-1.5 text-xs bg-pink-600 hover:bg-pink-500 text-white font-medium px-3.5 py-2 rounded-xl transition-all shadow-md shadow-pink-600/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> 新增周邊紀錄
                </button>
            </div>

            <!-- 周邊紀錄分組清單 -->
            <div id="merchGroupList" class="space-y-6"></div>
        </section>
    </main>

    <!-- Modal: 使用者切換 / 新增 -->
    <div id="userModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                <i data-lucide="users" class="w-5 h-5 text-pink-400"></i> 切換使用者暱稱
            </h3>
            <p class="text-xs text-slate-400">不同使用者擁有一整套獨立的推活紀錄與資料庫。</p>
            <div class="space-y-3">
                <label class="text-xs text-slate-400">目前已有使用者：</label>
                <div id="userList" class="space-y-1.5 max-h-40 overflow-y-auto"></div>
            </div>
            <div class="space-y-2 border-t border-slate-800 pt-3">
                <label class="text-xs text-slate-400">新增或直接切換新暱稱：</label>
                <div class="flex gap-2">
                    <input type="text" id="newUsernameInput" placeholder="輸入新的使用者名稱" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                    <button onclick="switchUserFromInput()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition-all">切換</button>
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="closeModal('userModal')" class="text-xs text-slate-400 hover:text-white">關閉</button>
            </div>
        </div>
    </div>

    <!-- Modal: 新增 / 編輯 VTuber 主推 -->
    <div id="oshiModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="oshiModalTitle" class="text-lg font-bold text-white">新增 VTuber 主推</h3>
                <button onclick="closeModal('oshiModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="oshiForm" onsubmit="handleSaveOshi(event)" class="space-y-4">
                <input type="hidden" id="oshiFormId">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">VTuber 名字 *</label>
                    <input type="text" id="oshiFormName" required placeholder="例如: 櫻巫女 / Sakura Miko" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">生日 (MM-DD)</label>
                        <input type="text" id="oshiFormBirthday" placeholder="03-05" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">出道日期 (YYYY-MM-DD)</label>
                        <input type="date" id="oshiFormDebut" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">頭像圖片</label>
                        <input type="file" id="oshiFormAvatarFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">背景封面圖片</label>
                        <input type="file" id="oshiFormCoverFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">特色標籤 (用逗號或空格分隔)</label>
                    <input type="text" id="oshiFormTags" placeholder="#歌勢, #遊戲勢, #Hololive" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-pink-500">
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-300">社群與頻道網址</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <input type="url" id="oshiSocialYoutube" placeholder="YouTube 網址" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-slate-200">
                        <input type="url" id="oshiSocialTwitter" placeholder="X (Twitter) 網址" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-slate-200">
                        <input type="url" id="oshiSocialTwitch" placeholder="Twitch 網址" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-slate-200">
                        <input type="url" id="oshiSocialInstagram" placeholder="Instagram 網址" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">個人簡介 / 應援筆記</label>
                    <textarea id="oshiFormBio" rows="3" placeholder="記錄這一位 VTuber 的特色、迷因或應援心得..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-pink-500"></textarea>
                </div>
                <div class="flex items-center justify-between pt-2">
                    <button type="button" id="deleteOshiBtn" onclick="handleDeleteOshi()" class="text-xs text-red-400 hover:text-red-300 hidden">刪除此主推</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeModal('oshiModal')" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">取消</button>
                        <button type="submit" class="px-4 py-2 rounded-xl text-xs bg-pink-600 hover:bg-pink-500 text-white font-medium">儲存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: 行程新增/編輯 -->
    <div id="eventModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">新增活動行程</h3>
                <button onclick="closeModal('eventModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveEvent(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">行程日期</label>
                    <input type="date" id="eventDateInput" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">行程標題 *</label>
                    <input type="text" id="eventTitleInput" required placeholder="例如: 3D 新衣裝發表會" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">事件分類標籤</label>
                    <select id="eventTypeInput" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                        <option value="直播預告">直播預告</option>
                        <option value="會員限定">會員限定</option>
                        <option value="桌布發布">桌布發布</option>
                        <option value="紀念日">紀念日</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">備註說明</label>
                    <input type="text" id="eventNoteInput" placeholder="例如: 晚上 20:00 開始" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('eventModal')" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-xs bg-pink-600 hover:bg-pink-500 text-white font-medium">儲存行程</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: 周邊戰利品新增 -->
    <div id="merchModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">新增周邊收藏</h3>
                <button onclick="closeModal('merchModal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form onsubmit="handleSaveMerch(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">活動/主題分類名稱 *</label>
                    <input type="text" id="merchGroupInput" required placeholder="例如: 2026 生日紀念周邊" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">周邊商品名稱 *</label>
                    <input type="text" id="merchNameInput" required placeholder="例如: 複製簽名壓克力牌" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">單價 (NT$) *</label>
                        <input type="number" id="merchPriceInput" required min="0" placeholder="500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">數量 *</label>
                        <input type="number" id="merchQtyInput" required min="1" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">購買管道</label>
                        <input type="text" id="merchChannelInput" placeholder="例如: 官方線上商城 / Booth" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">商品照片照片</label>
                        <input type="file" id="merchPhotoInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-slate-800 file:text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">備註說明</label>
                    <input type="text" id="merchNoteInput" placeholder="例如: 預計 11 月出貨" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('merchModal')" class="px-4 py-2 rounded-xl text-xs bg-slate-800 text-slate-300">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-xs bg-pink-600 hover:bg-pink-500 text-white font-medium">新增至戰利品區</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯機制 -->
    <script>
        // === 狀態管理 State ===
        let currentUser = '預設推活粉';
        let currentOshiId = null;
        let currentView = 'home';
        let currentCalendarDate = new Date();

        // 預設主推結構樣板
        const createDefaultOshi = (name) => ({
            id: 'oshi_' + Date.now(),
            name: name,
            birthday: '03-05',
            debut: '2022-08-01',
            avatar: '',
            cover: '',
            tags: ['#歌勢', '#遊戲勢'],
            socials: { youtube: '', twitter: '', twitch: '', instagram: '' },
            bio: '歡迎使用 VTuber 推活 Suite！這是一個紀錄主推行程、直播與周邊戰利品的專屬空間。',
            streamUrl: '',
            events: [],
            merch: []
        });

        // === 初始化數據 Initialization ===
        window.addEventListener('DOMContentLoaded', () => {
            initUserData();
            lucide.createIcons();
        });

        function initUserData() {
            const savedUser = localStorage.getItem('oshi_app_current_user');
            if (savedUser) currentUser = savedUser;
            document.getElementById('currentUserLabel').innerText = currentUser;

            let data = getStorageData();
            if (!data.oshis || data.oshis.length === 0) {
                // 初次引導：自動建立第一位主推
                const defaultOshi = createDefaultOshi('櫻巫女 (Sakura Miko)');
                data.oshis = [defaultOshi];
                saveStorageData(data);
                currentOshiId = defaultOshi.id;
            } else {
                currentOshiId = data.oshis[0].id;
            }

            renderAll();
        }

        // LocalStorage Helpers
        function getStorageData() {
            const raw = localStorage.getItem(`oshi_data_${currentUser}`);
            return raw ? JSON.parse(raw) : { oshis: [] };
        }

        function saveStorageData(data) {
            localStorage.setItem(`oshi_data_${currentUser}`, JSON.stringify(data));
        }

        function getCurrentOshi() {
            const data = getStorageData();
            return data.oshis.find(o => o.id === currentOshiId) || data.oshis[0];
        }

        function updateCurrentOshi(updatedOshi) {
            const data = getStorageData();
            const index = data.oshis.findIndex(o => o.id === updatedOshi.id);
            if (index !== -1) {
                data.oshis[index] = updatedOshi;
                saveStorageData(data);
            }
        }

        // === 畫面渲染總控 Render Manager ===
        function renderAll() {
            renderOshiTabs();
            renderHomeView();
            renderCalendarView();
            renderMerchView();
            renderOshiEditButton();
            lucide.createIcons();
        }

        // 切換主頁籤 View Switcher
        function switchView(viewName) {
            currentView = viewName;
            ['home', 'calendar', 'merch'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const tab = document.getElementById(`tab-${v}`);
                if (v === viewName) {
                    el.classList.remove('hidden');
                    tab.classList.add('bg-pink-600', 'text-white', 'shadow-md');
                    tab.classList.remove('text-slate-400', 'hover:text-white');
                } else {
                    el.classList.add('hidden');
                    tab.classList.remove('bg-pink-600', 'text-white', 'shadow-md');
                    tab.classList.add('text-slate-400', 'hover:text-white');
                }
            });
            lucide.createIcons();
        }

        // 渲染頂部主推 Tabs
        function renderOshiTabs() {
            const data = getStorageData();
            const container = document.getElementById('oshiTabBar');
            container.innerHTML = '';

            data.oshis.forEach(oshi => {
                const isActive = oshi.id === currentOshiId;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    currentOshiId = oshi.id;
                    renderAll();
                };
                btn.className = `flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold transition-all shrink-0 border ${
                    isActive 
                    ? 'bg-slate-800 border-pink-500/80 text-white shadow-lg shadow-pink-500/10' 
                    : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:bg-slate-800'
                }`;

                const avatarSrc = oshi.avatar || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
                btn.innerHTML = `
                    <img src="${avatarSrc}" class="w-5 h-5 rounded-full object-cover border border-slate-700">
                    <span>${oshi.name}</span>
                `;
                container.appendChild(btn);
            });
        }

        function renderOshiEditButton() {
            const container = document.getElementById('oshiEditBtnContainer');
            container.innerHTML = `
                <button onclick="openEditOshiModal()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 編輯主推檔案
                </button>
            `;
        }

        // === 視圖 1: 推活主頁 Logic ===
        function renderHomeView() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            document.getElementById('oshiName').innerText = oshi.name;
            document.getElementById('oshiBirthday').innerText = oshi.birthday || '--/--';
            document.getElementById('oshiDebut').innerText = oshi.debut || '----/--/--';
            document.getElementById('oshiBio').innerText = oshi.bio || '尚未填寫個人簡介或筆記...';

            // 頭像與封面
            const avatarEl = document.getElementById('oshiAvatar');
            avatarEl.src = oshi.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80';
            
            const coverEl = document.getElementById('oshiCover');
            if (oshi.cover) {
                coverEl.style.backgroundImage = `url('${oshi.cover}')`;
            } else {
                coverEl.style.backgroundImage = 'linear-gradient(to right, #0f172a, #3b0764, #0f172a)';
            }

            // 特色標籤 Tags
            const tagsContainer = document.getElementById('oshiTags');
            tagsContainer.innerHTML = '';
            (oshi.tags || []).forEach(tag => {
                if (!tag.trim()) return;
                const span = document.createElement('span');
                span.className = 'text-xs font-medium px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700';
                span.innerText = tag.startsWith('#') ? tag : `#${tag}`;
                tagsContainer.appendChild(span);
            });

            // 社群連結 Socials
            const socialContainer = document.getElementById('oshiSocialLinks');
            socialContainer.innerHTML = '';
            const socials = [
                { key: 'youtube', label: 'YouTube 頻道', icon: 'youtube', color: 'text-red-500' },
                { key: 'twitter', label: 'X (Twitter)', icon: 'twitter', color: 'text-sky-400' },
                { key: 'twitch', label: 'Twitch 實況', icon: 'tv', color: 'text-purple-400' },
                { key: 'instagram', label: 'Instagram', icon: 'instagram', color: 'text-pink-400' },
            ];

            let hasSocial = false;
            socials.forEach(s => {
                const url = oshi.socials?.[s.key];
                if (url) {
                    hasSocial = true;
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-slate-700 hover:bg-slate-800/50 transition-all text-xs font-medium text-slate-300';
                    a.innerHTML = `
                        <span class="flex items-center gap-2"><i data-lucide="${s.icon}" class="w-4 h-4 ${s.color}"></i> ${s.label}</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-500"></i>
                    `;
                    socialContainer.appendChild(a);
                }
            });
            if (!hasSocial) {
                socialContainer.innerHTML = '<span class="text-xs text-slate-500">尚無社群連結</span>';
            }

            // YouTube 直播嵌入 Stream Embed
            document.getElementById('streamUrlInput').value = oshi.streamUrl || '';
            renderStreamEmbed(oshi.streamUrl);
        }

        function saveStreamUrl() {
            const url = document.getElementById('streamUrlInput').value.trim();
            const oshi = getCurrentOshi();
            oshi.streamUrl = url;
            updateCurrentOshi(oshi);
            renderStreamEmbed(url);
        }

        function renderStreamEmbed(url) {
            const container = document.getElementById('streamEmbedContainer');
            const badge = document.getElementById('streamStatusBadge');
            
            const videoId = extractYouTubeId(url);
            if (videoId) {
                badge.innerText = '已載入預告/直播';
                badge.className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                container.innerHTML = `
                    <iframe class="w-full h-full" src="https://www.youtube.com/embed/${videoId}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                `;
            } else {
                badge.innerText = '未設定';
                badge.className = 'text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700';
                container.innerHTML = `
                    <div class="text-center space-y-2">
                        <i data-lucide="youtube" class="w-12 h-12 mx-auto text-slate-700"></i>
                        <p>貼上 YouTube 網址即可即時嵌入播放器</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // === 視圖 2: 活動行事曆 Logic ===
        function renderCalendarView() {
            const oshi = getCurrentOshi();
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            document.getElementById('calendarMonthLabel').innerText = `${year} 年 ${month + 1} 月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            // 填補月初空白
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'min-h-[90px] bg-slate-950/20 border border-slate-900 rounded-xl p-1 opacity-30';
                grid.appendChild(emptyCell);
            }

            // 渲染每日 Cell
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = isCurrentMonth && today.getDate() === day;

                cell.className = `min-h-[90px] bg-slate-950/80 border ${isToday ? 'border-pink-500/80 bg-pink-950/10' : 'border-slate-800/80'} rounded-xl p-2 flex flex-col justify-between hover:border-slate-700 cursor-pointer transition-all`;
                cell.onclick = () => openAddEventModal(dateStr);

                // 當日 events
                const dayEvents = (oshi.events || []).filter(e => e.date === dateStr);

                let eventsHtml = '';
                dayEvents.forEach(e => {
                    const tagClass = getEventTypeColor(e.type);
                    eventsHtml += `
                        <div class="text-[10px] ${tagClass} px-1.5 py-0.5 rounded truncate font-medium mb-1">
                            ${e.title}
                        </div>
                    `;
                });

                cell.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold ${isToday ? 'text-pink-400 bg-pink-500/20 px-1.5 py-0.5 rounded-full' : 'text-slate-400'}">${day}</span>
                        ${dayEvents.length > 0 ? `<span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>` : ''}
                    </div>
                    <div class="space-y-0.5 mt-1 overflow-hidden">${eventsHtml}</div>
                `;
                grid.appendChild(cell);
            }

            // 渲染本月行程清單
            renderMonthlyEventsList(year, month + 1);
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendarView();
        }

        function jumpToToday() {
            currentCalendarDate = new Date();
            renderCalendarView();
        }

        function getEventTypeColor(type) {
            switch(type) {
                case '直播預告': return 'bg-red-500/20 text-red-300 border border-red-500/30';
                case '會員限定': return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                case '桌布發布': return 'bg-sky-500/20 text-sky-300 border border-sky-500/30';
                case '紀念日': return 'bg-purple-500/20 text-purple-300 border border-purple-500/30';
                default: return 'bg-slate-800 text-slate-300';
            }
        }

        function renderMonthlyEventsList(year, month) {
            const oshi = getCurrentOshi();
            const container = document.getElementById('monthlyEventsList');
            container.innerHTML = '';

            const prefix = `${year}-${String(month).padStart(2, '0')}`;
            const monthlyEvents = (oshi.events || [])
                .filter(e => e.date.startsWith(prefix))
                .sort((a, b) => a.date.localeCompare(b.date));

            if (monthlyEvents.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 py-2">本月份尚無預定的活動或行程。</p>';
                return;
            }

            monthlyEvents.forEach(e => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-950/50 border border-slate-800 text-xs';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-mono font-bold text-pink-400">${e.date}</span>
                        <span class="font-semibold text-slate-200">${e.title}</span>
                        <span class="px-2 py-0.5 rounded text-[10px] ${getEventTypeColor(e.type)}">${e.type}</span>
                        ${e.note ? `<span class="text-slate-500 text-[11px]">${e.note}</span>` : ''}
                    </div>
                    <button onclick="deleteEvent('${e.id}')" class="text-slate-500 hover:text-red-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        // === 視圖 3: 周邊戰利品與花費 Logic ===
        function renderMerchView() {
            const oshi = getCurrentOshi();
            const merchList = oshi.merch || [];

            // 計算總金額
            const totalCost = merchList.reduce((acc, curr) => acc + (Number(curr.price) * Number(curr.qty)), 0);
            document.getElementById('totalMerchCost').innerText = totalCost.toLocaleString();

            const container = document.getElementById('merchGroupList');
            container.innerHTML = '';

            if (merchList.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-500 border border-dashed border-slate-800 rounded-2xl"><i data-lucide="package-open" class="w-10 h-10 mx-auto text-slate-700 mb-2"></i><p class="text-xs">尚未紀錄任何周邊戰利品</p></div>';
                lucide.createIcons();
                return;
            }

            // 依據「活動/主題 group」進行 Grouping
            const grouped = {};
            merchList.forEach(item => {
                const groupName = item.group || '一般購買紀錄';
                if (!grouped[groupName]) grouped[groupName] = [];
                grouped[groupName].push(item);
            });

            Object.keys(grouped).forEach(groupName => {
                const groupItems = grouped[groupName];
                const groupSubtotal = groupItems.reduce((acc, curr) => acc + (Number(curr.price) * Number(curr.qty)), 0);

                const groupCard = document.createElement('div');
                groupCard.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4';

                let itemsHtml = '';
                groupItems.forEach(item => {
                    const subtotal = Number(item.price) * Number(item.qty);
                    const photoHtml = item.photo 
                        ? `<img src="${item.photo}" class="w-12 h-12 rounded-lg object-cover border border-slate-800 shrink-0">`
                        : `<div class="w-12 h-12 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center text-slate-700 shrink-0"><i data-lucide="image" class="w-5 h-5"></i></div>`;

                    itemsHtml += `
                        <div class="flex items-center justify-between p-3 rounded-xl bg-slate-950/60 border border-slate-800/80 gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                ${photoHtml}
                                <div class="min-w-0">
                                    <h5 class="text-xs font-bold text-slate-200 truncate">${item.name}</h5>
                                    <p class="text-[11px] text-slate-400">NT$ ${Number(item.price).toLocaleString()} × ${item.qty}件 ${item.channel ? `• <span class="text-slate-500">${item.channel}</span>` : ''}</p>
                                    ${item.note ? `<p class="text-[10px] text-slate-500 truncate">${item.note}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-4 shrink-0">
                                <span class="text-xs font-bold text-pink-400">NT$ ${subtotal.toLocaleString()}</span>
                                <button onclick="deleteMerchItem('${item.id}')" class="text-slate-500 hover:text-red-400 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    `;
                });

                groupCard.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                            <h4 class="text-sm font-bold text-white">${groupName}</h4>
                        </div>
                        <span class="text-xs text-slate-400">小計: <strong class="text-slate-200">NT$ ${groupSubtotal.toLocaleString()}</strong></span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${itemsHtml}</div>
                `;
                container.appendChild(groupCard);
            });

            lucide.createIcons();
        }

        // === Modal & Form Actions ===
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // 使用者管理
        function openUserModal() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            // 掃描所有 user
            const users = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('oshi_data_')) {
                    users.push(key.replace('oshi_data_', ''));
                }
            }

            users.forEach(u => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 rounded-xl text-xs ${u === currentUser ? 'bg-pink-500/10 border border-pink-500/30 text-pink-300' : 'bg-slate-950 border border-slate-800 text-slate-300 hover:bg-slate-800'}`;
                div.innerHTML = `
                    <span>${u}</span>
                    ${u !== currentUser ? `<button onclick="switchUser('${u}')" class="text-pink-400 hover:underline">切換</button>` : '<span class="text-[10px] text-pink-500 font-bold">當前</span>'}
                `;
                userList.appendChild(div);
            });

            openModal('userModal');
        }

        function switchUser(username) {
            currentUser = username;
            localStorage.setItem('oshi_app_current_user', currentUser);
            closeModal('userModal');
            initUserData();
        }

        function switchUserFromInput() {
            const input = document.getElementById('newUsernameInput').value.trim();
            if (input) {
                switchUser(input);
                document.getElementById('newUsernameInput').value = '';
            }
        }

        // 主推新增/編輯
        function openAddOshiModal() {
            document.getElementById('oshiModalTitle').innerText = '新增 VTuber 主推';
            document.getElementById('oshiForm').reset();
            document.getElementById('oshiFormId').value = '';
            document.getElementById('deleteOshiBtn').classList.add('hidden');
            openModal('oshiModal');
        }

        function openEditOshiModal() {
            const oshi = getCurrentOshi();
            if (!oshi) return;

            document.getElementById('oshiModalTitle').innerText = '編輯 VTuber 主推檔案';
            document.getElementById('oshiFormId').value = oshi.id;
            document.getElementById('oshiFormName').value = oshi.name || '';
            document.getElementById('oshiFormBirthday').value = oshi.birthday || '';
            document.getElementById('oshiFormDebut').value = oshi.debut || '';
            document.getElementById('oshiFormTags').value = (oshi.tags || []).join(', ');
            document.getElementById('oshiSocialYoutube').value = oshi.socials?.youtube || '';
            document.getElementById('oshiSocialTwitter').value = oshi.socials?.twitter || '';
            document.getElementById('oshiSocialTwitch').value = oshi.socials?.twitch || '';
            document.getElementById('oshiSocialInstagram').value = oshi.socials?.instagram || '';
            document.getElementById('oshiFormBio').value = oshi.bio || '';

            document.getElementById('deleteOshiBtn').classList.remove('hidden');
            openModal('oshiModal');
        }

        async function handleSaveOshi(e) {
            e.preventDefault();
            const id = document.getElementById('oshiFormId').value;
            const data = getStorageData();

            const avatarFile = document.getElementById('oshiFormAvatarFile').files[0];
            const coverFile = document.getElementById('oshiFormCoverFile').files[0];

            let avatarBase64 = '';
            let coverBase64 = '';

            if (avatarFile) avatarBase64 = await convertBase64(avatarFile, 300);
            if (coverFile) coverBase64 = await convertBase64(coverFile, 800);

            const tagsRaw = document.getElementById('oshiFormTags').value;
            const tags = tagsRaw.split(/[,，\s]+/).filter(Boolean);

            if (id) {
                // 編輯舊資料
                const oshi = data.oshis.find(o => o.id === id);
                oshi.name = document.getElementById('oshiFormName').value;
                oshi.birthday = document.getElementById('oshiFormBirthday').value;
                oshi.debut = document.getElementById('oshiFormDebut').value;
                oshi.tags = tags;
                oshi.socials = {
                    youtube: document.getElementById('oshiSocialYoutube').value,
                    twitter: document.getElementById('oshiSocialTwitter').value,
                    twitch: document.getElementById('oshiSocialTwitch').value,
                    instagram: document.getElementById('oshiSocialInstagram').value,
                };
                oshi.bio = document.getElementById('oshiFormBio').value;
                if (avatarBase64) oshi.avatar = avatarBase64;
                if (coverBase64) oshi.cover = coverBase64;
            } else {
                // 新增
                const newOshi = createDefaultOshi(document.getElementById('oshiFormName').value);
                newOshi.birthday = document.getElementById('oshiFormBirthday').value;
                newOshi.debut = document.getElementById('oshiFormDebut').value;
                newOshi.tags = tags;
                newOshi.socials = {
                    youtube: document.getElementById('oshiSocialYoutube').value,
                    twitter: document.getElementById('oshiSocialTwitter').value,
                    twitch: document.getElementById('oshiSocialTwitch').value,
                    instagram: document.getElementById('oshiSocialInstagram').value,
                };
                newOshi.bio = document.getElementById('oshiFormBio').value;
                if (avatarBase64) newOshi.avatar = avatarBase64;
                if (coverBase64) newOshi.cover = coverBase64;

                data.oshis.push(newOshi);
                currentOshiId = newOshi.id;
            }

            saveStorageData(data);
            closeModal('oshiModal');
            renderAll();
        }

        function handleDeleteOshi() {
            if (!confirm('確定要刪除這一位主推的所有資料與紀錄嗎？此動作無法復原。')) return;

            const data = getStorageData();
            data.oshis = data.oshis.filter(o => o.id !== currentOshiId);
            
            if (data.oshis.length === 0) {
                const defaultOshi = createDefaultOshi('櫻巫女');
                data.oshis = [defaultOshi];
            }
            currentOshiId = data.oshis[0].id;
            saveStorageData(data);
            closeModal('oshiModal');
            renderAll();
        }

        // 行程管理 Event Actions
        function openAddEventModal(dateStr = '') {
            document.getElementById('eventDateInput').value = dateStr || new Date().toISOString().split('T')[0];
            document.getElementById('eventTitleInput').value = '';
            document.getElementById('eventNoteInput').value = '';
            openModal('eventModal');
        }

        function handleSaveEvent(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi.events) oshi.events = [];

            const newEvent = {
                id: 'evt_' + Date.now(),
                date: document.getElementById('eventDateInput').value,
                title: document.getElementById('eventTitleInput').value,
                type: document.getElementById('eventTypeInput').value,
                note: document.getElementById('eventNoteInput').value
            };

            oshi.events.push(newEvent);
            updateCurrentOshi(oshi);
            closeModal('eventModal');
            renderCalendarView();
        }

        function deleteEvent(eventId) {
            const oshi = getCurrentOshi();
            oshi.events = oshi.events.filter(e => e.id !== eventId);
            updateCurrentOshi(oshi);
            renderCalendarView();
        }

        // 周邊管理 Merch Actions
        function openAddMerchModal() {
            document.getElementById('merchGroupInput').value = '';
            document.getElementById('merchNameInput').value = '';
            document.getElementById('merchPriceInput').value = '';
            document.getElementById('merchQtyInput').value = '1';
            document.getElementById('merchChannelInput').value = '';
            document.getElementById('merchNoteInput').value = '';
            document.getElementById('merchPhotoInput').value = '';
            openModal('merchModal');
        }

        async function handleSaveMerch(e) {
            e.preventDefault();
            const oshi = getCurrentOshi();
            if (!oshi.merch) oshi.merch = [];

            const photoFile = document.getElementById('merchPhotoInput').files[0];
            let photoBase64 = '';
            if (photoFile) photoBase64 = await convertBase64(photoFile, 300);

            const newMerch = {
                id: 'merch_' + Date.now(),
                group: document.getElementById('merchGroupInput').value.trim() || '一般周邊',
                name: document.getElementById('merchNameInput').value.trim(),
                price: document.getElementById('merchPriceInput').value,
                qty: document.getElementById('merchQtyInput').value,
                channel: document.getElementById('merchChannelInput').value,
                note: document.getElementById('merchNoteInput').value,
                photo: photoBase64
            };

            oshi.merch.push(newMerch);
            updateCurrentOshi(oshi);
            closeModal('merchModal');
            renderMerchView();
        }

        function deleteMerchItem(merchId) {
            const oshi = getCurrentOshi();
            oshi.merch = oshi.merch.filter(m => m.id !== merchId);
            updateCurrentOshi(oshi);
            renderMerchView();
        }

        // 工具函式：圖片壓縮 Base64
        function convertBase64(file, maxWidth = 500) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let scale = maxWidth / img.width;
                        if (scale > 1) scale = 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }
    </script>
